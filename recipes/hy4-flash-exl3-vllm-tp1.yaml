# Facts that ARE verified on GB10:
#  - pack: EXL3 3.0-bit MCG routed experts + FP8-native dense linears (128x128 scales in-pack)
#  - sm_121 FP8-blockwise kernel = cutlass ONLY (torch DSM kernel is SM90-only)
#  - weights that must stay BF16: vit/visual tower, indexer projections, kv_a_proj_with_mqa (N=576
#    not 128-aligned, cutlass rejects), q_a_proj + fused_qkv_a_proj (merged layer takes one quant_config)
#  - spec (DFly, depth 3 and 5): acceptance length 1.00 — drafter loader skips weight_scale_inv; fix
#    applied in dfly.py, retest pending
