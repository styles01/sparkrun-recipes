recipe_version: "2"
model: bleysg/Qwen3.5-122B-A10B-int4-fp8-hybrid
runtime: vllm
container: vllm-v26-patched:latest

metadata:
  description: "Qwen3.5 122B A10B hybrid INT4+FP8 on vLLM 26 with fp8 KV, DFlash n=7, FlashInfer, and int8 lm-head patch"
  maintainer: styles01
  tags:
    - qwen
    - qwen3.5
    - 122b
    - vllm-26
    - fp8-kv
    - dflash
    - int8-lmhead

cluster_only: false
mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 3
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  attention_backend: FLASHINFER
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  served_model_name: qwen-122b

env:
  HF_HOME: /root/.cache/huggingface
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

executor_config:
  entrypoint: ""
  auto_remove: false
  user: root

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.5-122B-A10B-DFlash","num_speculative_tokens":7}'
