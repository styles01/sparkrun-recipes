recipe_version: "4"
name: qwen3.8-27b-nvfp4-dspark-official
description: "Qwen3.8 27B NVFP4 + DSpark drafter (k=14) + prefix caching on OFFICIAL vllm/vllm-openai:v0.27.1-aarch64. Targets ~75 tok/s single-stream (0xBakeer config). bfloat16 KV (DSpark forces FLASH_ATTN which rejects fp8)."
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.27.1-aarch64
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-16"
  updated: "2026-08-16"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - nvfp4
    - dspark
    - gb10
    - official
  runbook: runbooks/qwen-38-27b-dspark-official.md
  source: https://x.com/0xBakeer/status/2089090318905774558

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

# CRITICAL: DSpark drafter forces FLASH_ATTN which REJECTS fp8 KV cache.
# Use bfloat16 KV cache (the author's config). Official vllm image (not drowzeys).
# Drafter: Doopeworld/Qwen3.8-27B-DSpark-vLLM (2.7GB, 1.36B params).

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 16384
  kv_cache_dtype: bfloat16
  speculative_config: '{"method":"dspark","model":"Doopeworld/Qwen3.8-27B-DSpark-vLLM","num_speculative_tokens":14,"draft_sample_method":"probabilistic"}'
  tool_call_parser: qwen3_coder
  enable_auto_tool_choice: true
  enable_prefix_caching: true
  served_model_name: "qwen38-27b unsloth/Qwen3.8-27B-NVFP4"

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

# NOTE: DSpark drafter (Doopeworld/Qwen3.8-27B-DSpark-vLLM) is a separate 2.7GB model.
# k=14 for single-stream latency (75 tok/s); k=7 for aggregate throughput.
# --kv-cache-dtype bfloat16 is REQUIRED (DSpark forces FLASH_ATTN which rejects fp8).

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
