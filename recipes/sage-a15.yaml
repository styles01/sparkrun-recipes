recipe_version: "2"
name: sage-a15
description: "Sage-A1.5 35B-A3B agentic MoE VLM (Qwen3.6-based, Apache-2.0) — bf16, single-node GB10, vLLM v26-patched, 262K context"
model: InternScience/Sage-A1.5
runtime: vllm
container: vllm/vllm-openai@sha256:b0501f99fec5136f248f78d5850977a2ec32d55cd9a665f4a9ffef24cbdf7fe5  # arm64-cu130 pin, arch test passed 10-22
maintainer: styles01

metadata:
  author: styles01
  created: "2026-10-22"
  updated: "2026-10-22"
  tags:
    - sage
    - qwen3_5_moe
    - agentic
    - vlm
    - bf16
    - gb10

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 3
  max_num_batched_tokens: 8192
  kv_cache_dtype: bf16
  load_format: fastsafetensors
  served_model_name: InternScience/Sage-A1.5
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  enable_prefix_caching: true
  enable_chunked_prefill: true
  trust_remote_code: true
  enable_auto_tool_choice: true

executor_config:
  entrypoint: ""
  user: root
  shm_size: 16gb

env:
  HF_HOME: /root/.cache/huggingface
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

benchmark:
  framework: llama-benchy
  pp: [512]
  tg: [128]
  concurrency: [1, 2, 3]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}