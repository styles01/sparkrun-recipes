recipe_version: "2"
name: muse-glimmer-30b
model: meta-models/Muse-Glimmer-30B
runtime: vllm-distributed
container: vllm/vllm-openai:muse-glimmer
max_nodes: 1

metadata:
  description: |
    Meta Muse-Glimmer-30B — multimodal reasoning model, 30B dense,
    131K context, BF16. ATEM XML tool calling. Reasoning separated
    by --reasoning-parser muse_glimmer. Requires vLLM 0.27+ Docker image.
    On GB10/SM121: --enforce-eager (CUBLAS without it), --attention-backend
    FLASH_ATTN (FlashInfer hangs), no fp8 KV (unsupported with FLASH_ATTN).
    Sampling: temp=1.0, top_p=0.95, top_k=64 — do NOT run greedy.
  maintainer: styles01
  category: chat
  model_params: 30B
  model_dtype: bf16
  kv_dtype: bf16

defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 131072
  max_num_seqs: 4
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.85
  kv_cache_dtype: auto
  load_format: safetensors
  served_model_name: muse-glimmer-30b
  trust_remote_code: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: true
  attention_backend: FLASH_ATTN
  tool_call_parser: muse_glimmer
  reasoning_parser: muse_glimmer
  tensor_parallel: 1
  pipeline_parallel: 1

env: {}