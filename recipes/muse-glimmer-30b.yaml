recipe_version: "2"
name: muse-glimmer-30b
model: Inferact/Muse-Glimmer-30B-NVFP4-W4A4
runtime: vllm-distributed
container: vllm/vllm-openai:muse-glimmer
max_nodes: 1

metadata:
  description: |
    Meta Muse-Glimmer-30B NVFP4 + DFlash speculative decoding.
    30B dense, 131K context, 24GB NVFP4 weights, 15-token DFlash draft.
    ATEM XML tool calling. Reasoning model.
    On GB10/SM121: --enforce-eager, --attention-backend FLASH_ATTN, no fp8 KV.
  maintainer: styles01
  category: chat
  model_params: 30B
  model_dtype: nvfp4
  kv_dtype: auto

defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 131072
  max_num_seqs: 4
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.85
  kv_cache_dtype: auto
  load_format: safetensors
  served_model_name: muse-glimmer-30b
  trust_remote_code: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: true
  attention_backend: FLASH_ATTN
  tool_call_parser: muse_glimmer
  reasoning_parser: muse_glimmer
  enable_auto_tool_choice: true
  spec_method: dflash
  spec_model: meta-models/Muse-Glimmer-30B-assistant
  spec_tokens: 15
  tensor_parallel: 1
  pipeline_parallel: 1

env: {}