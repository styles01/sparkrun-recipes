recipe_version: "4"
name: qwen3.8-27b-nvfp4-mtp
description: "Qwen3.8 27B NVFP4 + MTP n=3 + fp8 KV + prefix caching on drowzeys GB10 build. Targets ~96 tok/s aggregate, ~31 tok/s single-stream. Validated, stable."
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/styles01/qwen38-mtp3:latest
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-16"
  updated: "2026-08-20"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - nvfp4
    - mtp
    - gb10
    - validated
  runbook: runbooks/qwen-38-27b-mtp.md
  source: https://x.com/0xBakeer/status/2089090318905774558

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

# VALIDATED CONFIG — running on Spark since 2026-08-20
# MTP n=3, fp8 KV, prefix caching ON, chunked prefill 8192
# GMU 0.55, 262K context, 4 lanes

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  tool_call_parser: qwen3_coder
  enable_auto_tool_choice: true
  enable_flashinfer_autotune: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  served_model_name: "qwen38-27b"

env:
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

# NOTES:
# - MTP n=3 validated: 96 aggregate tok/s, 31.7 single-stream, 6.45× KV concurrency
# - Prefix caching CRITICAL for long context: 14-22× speedup on shared prefixes
# - fp8 KV works with this image (unlike DSpark which forces FLASH_ATTN → bf16)
# - --enable-chunked-prefill 8192 for long context prefill

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
