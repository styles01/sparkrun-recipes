recipe_version: "4"
name: qwen3.8-27b-nvfp4-gb10
description: "Qwen3.8 27B NVFP4 + MTP n=3 + fp8 KV + prefix caching on drowzeys GB10 build. Targets ~96 tok/s aggregate, ~31 tok/s single-stream. Validated, stable."
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/styles01/qwen38-mtp3:latest
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-14"
  updated: "2026-08-20"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - nvfp4
    - mtp
    - gb10
    - drowzeys
  runbook: runbooks/qwen-38-27b.md
  source: "Derived from drowzeys GB10 build (repo deleted; image preserved as ghcr.io/styles01/qwen38-mtp3:latest)"

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

# CRITICAL: This image (eugr spark-vllm-b12x, mirrored by drowzeys) is GB10-specific.
# Stock vllm/vllm-openai has NO NVFP4 kernels for Blackwell sm_121a — that's why
# every stock-vLLM attempt crashed. This build provides FlashInferCutlassNvFp4LinearKernel.
# The drowzeys repo was deleted; image preserved as ghcr.io/styles01/qwen38-mtp3:latest.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  tool_call_parser: qwen3_coder
  enable_auto_tool_choice: true
  enable_flashinfer_autotune: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  served_model_name: "qwen38-27b"

env:
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

# NOTE: MTP n is capped at 3 (model has exactly 1 MTP layer). Depth >=4 crashes.
# Validated: 96 aggregate tok/s, 31.7 single-stream, 6.45× KV concurrency at GMU 0.55.
# Prefix caching ON is essential: 14-22× speedup on shared prefixes.

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [128]
  depth: [0, 4096, 8192, 16384, 32768, 65535, 100000]
  concurrency: [1, 2, 5, 10]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
