recipe_version: "4"
name: qwen3.8-27b-nvfp4-gb10-fast
description: "Qwen3.8 27B NVFP4 + MTP n=3 on GB10 vLLM. max_num_seqs=5 + batched 16384 for faster deep-context prefill. Variant of qwen3.8-27b-nvfp4-gb10."
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/drowzeys/keys-vllm-027-gb10-qwen38:mtp3-20260813
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-15"
  updated: "2026-08-15"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - nvfp4
    - mtp
    - gb10
    - fast
  runbook: runbooks/qwen-38-27b-gb10.md
  source: https://github.com/drowzeys/keys-vLLm.0.27-Qwen3.8-NVFP4-MTP3-Single-DGX-Spark
  parent: qwen3.8-27b-nvfp4-gb10

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

# GB10-specific vLLM build (eugr spark-vllm-b12x). Stock vllm-openai has NO
# NVFP4 kernels for Blackwell sm_121a — do NOT use stock images for NVFP4.
#
# WHY THIS VARIANT: the base recipe (max_num_seqs=10, no batched-tokens) let
# vLLM auto-cap max_num_scheduled_tokens at 2048 (MTP n=3 x 10 seqs), which
# slowed deep-context prefill. Dropping to 5 seqs lets us set batched=16384
# (8x) for much faster 65K/100K prefill. 5 lanes is plenty for real use
# (DS4=1-2, 122B=3 concurrent).

defaults:
  port: 8078
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  max_num_seqs: 5
  max_num_batched_tokens: 16384
  kv_cache_dtype: fp8
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  tool_call_parser: hermes
  enable_auto_tool_choice: true
  enable_flashinfer_autotune: true
  served_model_name: "qwen38-nvfp4 unsloth/Qwen3.8-27B-NVFP4"

env:
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

# MTP n capped at 3 (model has 1 MTP layer). KV pool ~2.31M tokens.
# NOTE: c=10 benchmark tasks queue through 5 lanes (no crash, capped agg).

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [128]
  depth: [0, 4096, 8192, 16384, 32768, 65535, 100000]
  concurrency: [1, 2, 5, 10]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
