recipe_version: '4'
name: kolibri1-vllm-plugin
description: "Aleph Alpha Kolibri-1 (78B-A3.46B MoE, FP8 block-quant, 4:1 SWA:GQA, 262144 ctx) on DGX Spark GB10 via vLLM 0.29 + the official aleph-alpha-inference 1.0.0 vLLM plugin, in an arm64 vllm/vllm-openai container. Apache-2.0. DRAFT ONLY \u2014 not deployed, weights not downloaded.\n"
model: Aleph-Alpha/Kolibri-1
model_revision: e52eb4627d11516b0c01de49210ab5a4e4061444
runtime: vllm
container: kolibri1:v0.29.0-p1
maintainer: styles01
metadata:
  author: styles01
  created: '2026-10-04'
  status: arena-live
  tags:
  - kolibri
  - kolibri1
  - aleph-alpha
  - moe
  - fp8
  - vllm
  - plugin
  - gb10
  - sm121
  - text-only
  - one-lane
  - draft
  quantization: FP8 (float8_e4m3fn) 128x128 blocks, dynamic activations, bf16 gates/router/emb/head
  model_dtype: fp8-dynamic
  engine_repo: https://github.com/Aleph-Alpha/aleph-alpha-inference
  engine_version: aleph-alpha-inference 1.0.0 (vLLM >=0.29.0,<0.30.0)
  source: https://huggingface.co/Aleph-Alpha/Kolibri-1
  announcement: https://x.com/Aleph__Alpha/status/2106306843052052616
  launch_blog: https://aleph-alpha.com/en/blog/kolibri-has-landed-a-sovereign-open-weight-model/
  tech_report: https://aleph-alpha.com/downloads/tech-report.pdf
executor_config:
  entrypoint: ''
  volumes:
  - /home/jaita/kolibri-moe-config:/moe-configs
solo_only: true
min_nodes: 1
max_nodes: 1
requirements:
  architecture: aarch64
  gpu_compute_capability: '12.1'
  exclusive_spark_lane: true
defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: Aleph-Alpha/Kolibri-1
  max_model_len: 131072
  max_num_seqs: 4
env:
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: '1'
command: "vllm serve Aleph-Alpha/Kolibri-1 \\\n  --host {host} --port {port} --served-model-name {served_model_name} \\\n  --max-model-len {max_model_len} --max-num-seqs {max_num_seqs} \\\n  --tensor-parallel-size 1 --kv-cache-dtype fp8 \\\n  --reasoning-parser kolibri1 --tool-call-parser kolibri1 \\\n  --enable-auto-tool-choice\n"
