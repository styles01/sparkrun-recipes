recipe_version: "4"
name: qwen3.8-flash-next-image
description: "Qwen3.8-Flash-Next (unsloth GGUF, UD-Q4_K_XL, 104GB/4 shards) on DGX Spark (GB10) via our OWN qwen4exp llama.cpp container (ghcr.io/styles01/qwen38-flash-next:q4). The 0xBakeer '180B-fits-in-119GB' trick: -ot per_layer_token_embd=CPU pins the 51B n-gram tensor to CPU (never GPU), -lm mmap serves it from NVMe. Full 262K context, ~19-22 tok/s decode. Thinking stays enabled with Qwen's supported low reasoning effort by default. First-to-post llama-cpp native benchmark under OUR image."
model: unsloth/Qwen3.8-Flash-Next-GGUF
runtime: llama-cpp
container: ghcr.io/styles01/qwen38-flash-next:q4
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-26"
  updated: "2026-08-26"
  tags:
    - qwen
    - qwen3.8
    - qwen4
    - flash-next
    - llama-cpp
    - gguf
    - q4_k_xl
    - gb10
    - spark-arena
    - first-post
    - container
  runbook: runbooks/qwen38-flash-next-image.md
  source: "https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF"
  container_source: "https://github.com/styles01/sparkrun-recipes/tree/main/docker/qwen38-flash-next"

solo_only: true
cluster_only: false

min_nodes: 1
max_nodes: 1

# OUR container ghcr.io/styles01/qwen38-flash-next:q4 bundles the llama.cpp
# qwen4exp fork (PR #27742, commit 035e227) + the 0xBaker launch trick + our
# perf tweaks. The container entrypoint (docker/qwen38-flash-next/launch.sh)
# launches the exact current Q4 config:
#   llama-server -m <UD-Q4_K_XL 0000{1,2,3,4}-of-00004.gguf> \
#     --alias qwen3.8-flash-next \
#     -lm mmap -ot per_layer_token_embd=CPU \
#     --n-gpu-layers 999 --ctx-size 262144 --parallel 1 \
#     --spec-type ngram-mod --jinja \
#     --chat-template-kwargs '{"enable_thinking":true,"reasoning_effort":"low"}' \
#     --temp 1.0 --top-p 0.95 --top-k 20 \
#     --host 0.0.0.0 --port 8000
# Reasoning stays ON but defaults to Qwen's supported `low` effort, rather
# than its embedded-template default of `xhigh`. Per-request low/medium/xhigh
# may still override this default.
# (0xBaker trick: -ot per_layer_token_embd=CPU pins the 51B n-gram token-embd
# tensor to CPU so it never lands on GPU; -lm mmap serves it from NVMe.)
# The server is ALREADY LIVE on 0.0.0.0:8000. We benchmark with --skip-run so
# sparkrun targets the running server rather than launching a second instance
# (which would collide on port 8000). The container entrypoint is the exact
# launch script; it is what a native (non --skip-run) run would start.
defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: qwen3.8-flash-next
  tensor_parallel: 1
  n_gpu_layers: 999
  max_model_len: 262144
  jinja: true
  cont_batching: true
  webui: false
  mmap: true

benchmark:
  framework: spark-arena
  tokenizer: Qwen/Qwen3.8-Flash-Next
  notes: "First-to-post Qwen3.8-Flash-Next GGUF UD-Q4_K_XL (104GB) on DGX Spark GB10 via llama.cpp qwen4exp fork in OUR OWN container (ghcr.io/styles01/qwen38-flash-next:q4). Current Q4 config: 262K ctx, spec-type ngram-mod (default n_max=3), temp 1.0 / top-p 0.95 / top-k 20. 0xBaker trick makes a 180B model fit 119GB: -ot per_layer_token_embd=CPU (51B n-gram tensor on CPU), -lm mmap (NVMe). ~22 tok/s decode free-form (up to 45 on copy-heavy). Run with --skip-run against the live server on 0.0.0.0:8000/v1."

# No command block on purpose: with --skip-run sparkrun never launches a server,
# so the launch template is not exercised. The container's entrypoint is the
# exact launch script; structured defaults above keep the recipe valid for the
# arena gate (model must be an HF id, container public).
