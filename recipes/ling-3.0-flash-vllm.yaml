model: inclusionAI/Ling-3.0-flash-int4
runtime: vllm
min_nodes: 1
max_nodes: 1
# Immutable public image. The KDA num_stages=2 GB10 safety patch is baked in.
container: ghcr.io/styles01/ling-3.0-flash-int4@sha256:7d5c3c7d28c4feb7b8e0033ecd1ca9d7f15e6bfdaec7930363adb3b7560ed472

metadata:
  description: "Ling-3.0-flash INT4 (124B MoE, 5.1B active) on vLLM ling_3_0 fork. MTP k=1, 256K ctx, 2 lanes, fp8 KV, mamba align, ling3 parsers. GB10 KDA num_stages=2 safety patch baked into the pinned image; qualify long-context multi-request stability before publishing Arena results."
  maintainer: styles01
  tags:
    - ling
    - ling-3.0-flash
    - inclusionAI
    - 124b
    - int4
    - vllm
    - 256k-context

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 2
  served_model_name: inclusionAI/Ling-3.0-flash-int4
  tool_call_parser: ling3
  reasoning_parser: ling3
  kv_cache_dtype: fp8
  mamba_cache_mode: align

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --mamba-cache-mode {mamba_cache_mode} \
    --speculative-config '{"method":"bailing_hybrid_v3_mtp","num_speculative_tokens":1}' \
    --default-chat-template-kwargs '{"enable_thinking":false}'
