recipe_version: "2"
name: qwen3.6-27b-fp8-mtp
description: "Qwen3.6 27B FP8 — MTP k=7 (48.7% accept), fp8 KV, async scheduling, 5 lanes, 256K context, GMU 0.79"
model: Qwen/Qwen3.6-27B-FP8
runtime: vllm
container: ghcr.io/styles01/vllm-v26-patched:latest
maintainer: styles01

metadata:
  author: styles01
  created: "2026-07-27"
  updated: "2026-07-27"
  tags:
    - qwen
    - qwen3.6
    - 27b
    - fp8
    - mtp
    - vllm-26
    - fp8-kv
    - async-scheduling
  runbook: runbooks/qwen-27b.md

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.79
  max_model_len: 262144
  max_num_seqs: 5
  max_num_batched_tokens: 32768
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: safetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  served_model_name: Qwen/Qwen3.6-27B-FP8
  speculative_config: '{"method":"mtp","num_speculative_tokens":7}'
  async_scheduling: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  trust_remote_code: true
  enable_auto_tool_choice: true

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [128]
  depth: [0, 4096, 8192, 16384, 32768, 65535, 100000]
  concurrency: [1, 2, 3]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}