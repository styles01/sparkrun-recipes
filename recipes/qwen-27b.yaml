recipe_version: "3"
name: qwen3.8-27b-fp8
description: "Qwen3.8 27B FP8 — MTP k=3, fp8 KV, enforce-eager, 256K context, vision support. Updated from Qwen 3.6."
model: Qwen/Qwen3.8-27B-FP8
runtime: vllm
container: vllm/vllm-openai:v0.27.1
maintainer: styles01

metadata:
  author: styles01
  created: "2026-07-27"
  updated: "2026-08-14"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - fp8
    - mtp
    - fp8-kv
    - enforce-eager
    - vision
  runbook: runbooks/qwen-27b.md

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.79
  max_model_len: 262144
  max_num_seqs: 5
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: fastsafetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  served_model_name: "qwen3.8-27b Qwen/Qwen3.8-27B-FP8"
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  async_scheduling: true
  enable_prefix_caching: false
  enable_chunked_prefill: true
  trust_remote_code: true
  enable_auto_tool_choice: true
  enforce_eager: true
  max_num_batched_tokens: 2048

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  TORCH_MATMUL_PRECISION: high

executor_config:
  entrypoint: ""
  auto_remove: false
  user: root

# NO Mamba patch needed for Qwen 3.8 — vLLM v0.27.1 has native MTP support.
# The PR #48375 patch was designed for Qwen 3.6 and CORRUPTS Qwen 3.8's built-in MTP.
# vLLM logs: "Detected MTP model. Sharing target model embedding/lm_head weights with the draft model."
#
# CRITICAL: --enforce-eager is REQUIRED. CUDA graph capture crashes MTP on Qwen 3.8's
# hybrid Mamba (Gated DeltaNet + full attention) architecture with cudaErrorIllegalAddress.
# GitHub issue #38643 documents the FLA linear attention tensor format mismatch.
# PR #34571 addresses CUDA graph capture on hybrid models but is not yet merged.

variants:
  recipe_production:
    description: "Production — MTP k=3, 5 seqs, GMU 0.79, enforce-eager (CUDA graphs crash MTP on hybrid Mamba)"
    gpu_memory_utilization: 0.79
    max_num_seqs: 5
  recipe_concurrent:
    description: "Concurrent stack — GMU 0.50, 8 seqs, leaves ~80GB for ComfyUI+GNOME"
    gpu_memory_utilization: 0.50
    max_num_seqs: 8

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [128]
  depth: [0, 4096, 8192, 16384, 32768, 65535, 100000]
  concurrency: [1, 2, 3]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --async-scheduling \
    --enable-chunked-prefill \
    --enforce-eager \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}