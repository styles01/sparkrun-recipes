recipe_version: "3"
name: qwen3.8-27b-fp8
description: "Qwen3.8 27B FP8 — MTP, fp8 KV, async scheduling, 256K context, vision support. Updated from Qwen 3.6."
model: Qwen/Qwen3.8-27B-FP8
runtime: vllm
container: vllm/vllm-openai:v0.27.1
maintainer: styles01

metadata:
  author: styles01
  created: "2026-07-27"
  updated: "2026-08-13"
  tags:
    - qwen
    - qwen3.8
    - 27b
    - fp8
    - mtp
    - fp8-kv
    - async-scheduling
    - vision
  runbook: runbooks/qwen-27b.md

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.79
  max_model_len: 262144
  max_num_seqs: 5
  max_num_batched_tokens: 32768
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: fastsafetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  served_model_name: "qwen3.8-27b Qwen/Qwen3.8-27B-FP8"
  speculative_config: '{"method":"mtp","num_speculative_tokens":7}'
  async_scheduling: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  trust_remote_code: true
  enable_auto_tool_choice: true

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  TORCH_MATMUL_PRECISION: high

patches:
  - patch_mamba_drop_eagle_v0271.sh

variants:
  recipe_production:
    description: "Production — MTP k=7, 5 seqs, GMU 0.79 (same as Qwen 3.6)"
    gpu_memory_utilization: 0.79
    max_num_seqs: 5
  recipe_concurrent:
    description: "Concurrent stack — GMU 0.50, 8 seqs, leaves ~80GB for ComfyUI+GNOME"
    gpu_memory_utilization: 0.50
    max_num_seqs: 8

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [128]
  depth: [0, 4096, 8192, 16384, 32768, 65535, 100000]
  concurrency: [1, 2, 3]
  prefix_caching: true
  runs: 3

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}