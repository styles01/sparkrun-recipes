recipe_version: "4"
name: qwen3.8-flash-next-vllm-nvfp4
description: "Qwen3.8-Flash-Next (RadixArk NVFP4, 126GB/206 shards) on DGX Spark (GB10) via vLLM built from blazux/qwen3.8-Flash-DGX (Apache-2.0). Native MTP draft head (n=3), full 262,144 context, PIECEWISE CUDA-graph capture with the PLE gather as a splitting op, VLLM_PLE_MMAP=1 (n-gram table served from disk). ~32.2 tok/s prose, prefill ~2,200-2,460 tok/s flat to 195k, decode flat at depth. ALTERNATIVE recipe - NOT YET DEPLOYED."
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: vllm
container: blazux/qwen3.8-Flash-DGX
maintainer: styles01

metadata:
  author: styles01
  created: "2026-08-27"
  updated: "2026-08-27"
  tags:
    - qwen
    - qwen3.8
    - qwen4
    - flash-next
    - vllm
    - nvfp4
    - mtp
    - gb10
    - spark-arena
    - alternative
    - not-yet-deployed
  runbook: runbooks/qwen38-flash-next-vllm-nvfp4.md
  source: "https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4"
  container_source: "https://github.com/blazux/qwen3.8-Flash-DGX"
  upstream_recipe: "https://github.com/0xBakeer/qwen38-flash-next-spark/tree/main/recipes/vllm-longctx"

solo_only: true
cluster_only: false

min_nodes: 1
max_nodes: 1

# ALTERNATIVE recipe — vLLM + NVFP4 + native MTP head. NOT YET DEPLOYED.
# This is the 0xBakeer vLLM long-context recipe, documented as an alternative
# option. It is complementary to our llama.cpp Q3_K_XL 2-lane primary recipe:
# vLLM wins on chat/prose/long-doc (flat decode at depth, ~5x faster prefill),
# while llama.cpp wins on concurrent coding-agent load (2 lanes, ~43-50 tok/s
# aggregate).
#
# Engine: vLLM built from blazux/qwen3.8-Flash-DGX (Apache-2.0), no version pin
#   (tracks upstream main). The container's patch serves the 51.2B n-gram/PLE
#   table from disk (VLLM_PLE_MMAP=1) — the only reason a 122 GiB checkpoint
#   fits next to a usable KV cache on one box.
# Weights: RadixArk/Qwen3.8-Flash-Next-NVFP4 — 126 GB on disk, 206 shards
#   (NVFP4 compute + FP8 PLE table + BF16 MTP head).
#
# Launch (from the upstream recipe's serve.sh, exact flags):
#   ./setup.sh   # clone+build blazux/qwen3.8-Flash-DGX, fetch ~126 GB checkpoint
#   ./serve.sh   # docker run with the config below
#
# Key config:
#   --max-model-len 262144 --max-num-seqs 2 --gpu-memory-utilization 0.85
#     (KV pool 18.13 GiB = 641,601 tokens, ~19 GiB headroom)
#   --speculative-config {"method":"mtp","num_speculative_tokens":3}
#   --no-enable-prefix-caching --enable-chunked-prefill --max-num-batched-tokens 8192
#   -cc.cudagraph_mode=PIECEWISE -cc.splitting_ops=[...]  (PLE gather as splitting op)
#   VLLM_PLE_MMAP=1 VLLM_PLE_MMAP_WORKERS=32 VLLM_PLE_MMAP_PREWARM=1
#   VLLM_USE_FLASHINFER_SAMPLER=1
#
# Measured (single-stream): prose 32.2 tok/s, prefill ~2,200-2,460 tok/s flat to
#   195k, decode flat at depth (31.7/33.5/31.7 at 1k/32k/128k), TTFT ~0.3s,
#   2 concurrent seqs.
#
# Caveats:
#   - No vLLM version pin (tracks upstream main).
#   - 12-15 min boot (loads ~83 GiB of weights).
#   - Prefix caching must stay off (GB10 GDN kernel bug).
#   - 111/121 GiB footprint tight against 119 GB.
#   - The n-gram gather must stay outside CUDA graphs (PIECEWISE capture only).
defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: qwen3.8-flash-next
  tensor_parallel: 1
  max_model_len: 262144
  max_num_seqs: 2
  gpu_memory_utilization: 0.85
  speculative_method: mtp
  num_speculative_tokens: 3
  enable_prefix_caching: false
  enable_chunked_prefill: true
  max_num_batched_tokens: 8192
  load_format: safetensors

env:
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  HF_HUB_OFFLINE: "1"

benchmark:
  framework: spark-arena
  tokenizer: Qwen/Qwen3.8-Flash-Next
  notes: "ALTERNATIVE recipe (NOT YET DEPLOYED): Qwen3.8-Flash-Next RadixArk NVFP4 (126GB/206 shards) on DGX Spark GB10 via vLLM (blazux/qwen3.8-Flash-DGX, Apache-2.0). Native MTP head n=3, full 262,144 context, PIECEWISE CUDA-graph capture, VLLM_PLE_MMAP=1. Measured single-stream: prose 32.2 tok/s, prefill ~2,200-2,460 tok/s flat to 195k, decode flat at depth (31.7/33.5/31.7), TTFT ~0.3s, 2 concurrent seqs. Complementary to the llama.cpp Q3 2-lane primary recipe (which wins on concurrent aggregate)."
