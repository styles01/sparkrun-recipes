recipe_version: "2"
model: bleysg/Qwen3.5-122B-A10B-int4-fp8-hybrid
runtime: vllm
container: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-06-18-v0.23.0-dflashfix

metadata:
  description: "Qwen3.5 122B A10B DFlash — hybrid INT4+FP8, n=7, aeon vLLM 0.23 with DFlash patches"
  maintainer: styles01

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 3
  max_num_batched_tokens: 8192
  load_format: fastsafetensors
  attention_backend: flash_attn
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  served_model_name: qwen

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.5-122B-A10B-DFlash","num_speculative_tokens":7,"attention_backend":"FLASH_ATTN"}'