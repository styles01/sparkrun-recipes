recipe_version: "4"
name: ornith-1.5-122b-exl3-eaq-tp1
description: >-
  Ornith-1.5-122B EXL3 EAQ v1 4.19bpw (Qwen3.5-MoE multimodal, mul1 codebook, unquantized
  bf16 vision tower) on ONE DGX Spark GB10 (sm_121, TP1). Engine: official vllm
  glm53-flash arm64 cu130 base + Zeuss5/cuda-exl3 v1.0.0 plugin built for sm_121 at boot
  (vllm.general_plugins exl3 loader; all bitrates 1-8; all codebooks incl mul1; MoE
  verified on Qwen3.5-35B-A3B 256-exp top-8; unquantized modules fall through to stock
  vLLM). Official vendor serve shape (no drafter): the card's serve line, no speculative
  config; in-pack MTP = the separate tuned submission after local k-sweep.
model: Mia-AiLab/Ornith-1.5-122B-EXL3-EAQv1-4-bpw
runtime: vllm
maintainer: styles01
min_nodes: 1
max_nodes: 1
cluster_only: true

container: vllm/vllm-openai:glm53-flash-arm64-cu130

executor_config:
  entrypoint: ""   # image ENTRYPOINT is ["vllm","serve"] and would eat sparkrun's launcher
  user: root       # pre_exec builds cuda-exl3 into root-owned dist-packages; uid-2000 default cannot
  shm_size: 16gb

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 131072
  max_num_seqs: 4
  max_num_batched_tokens: 2048
  gpu_memory_utilization: 0.90   # explicit: sparkrun default 0.92 OOMs mid-load on a full box
  served_model_name: Mia-AiLab/Ornith-1.5-122B-EXL3-EAQv1-4-bpw

env:
  TORCH_CUDA_ARCH_LIST: "12.1"          # sm_121 build of cuda_exl3._C
  HF_HOME: /cache/huggingface
  XDG_CACHE_HOME: /cache/runtime
  CUDA_EXL3_TUNE_CACHE: /cache/runtime/cuda_exl3_tune   # persist autotuner (first requests tune on GB10)
  CUDA_EXL3_DEBUG_NAMES: "1"            # first boot: confirm every quantized module resolved
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

pre_exec:
  - pip install --no-build-isolation "cuda-exl3 @ https://github.com/Zeuss5/cuda-exl3/archive/refs/tags/v1.0.0.tar.gz"
  - python3 -c "import cuda_exl3, torch, os; assert torch.cuda.get_device_capability()[0] >= 12; print('cuda_exl3 ok:', cuda_exl3.__version__)"

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --quantization exl3 \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization}
# GQA+GDN hybrid: no --attention-backend override (the plugin's CUSTOM backend is GLM sparse-MLA only).
# No drafter in the official vendor config; in-pack MTP (k=1..5 sweep) = the tuned follow-up submission.