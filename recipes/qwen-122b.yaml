recipe_version: "2"
name: qwen-122b-dflash
description: "Qwen 3.5 122B A10B DFlash — n=7, GMU 0.85, bf16 KV, 3 lanes, 256K context, aeon vLLM 0.23.0"
model: bleysg/Qwen3.5-122B-A10B-int4-fp8-hybrid
draft_model: z-lab/Qwen3.5-122B-A10B-DFlash
runtime: vllm
container: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-06-18-v0.23.0-dflashfix
maintainer: styles01

metadata:
  author: styles01
  created: "2026-07-24"
  updated: "2026-07-24"
  tags:
    - qwen
    - qwen3.5
    - 122b
    - dflash
    - aeon
    - bf16-kv
    - int4-fp8-hybrid
  runbook: runbooks/qwen-122b.md

solo_only: false
cluster_only: false

min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 3
  max_num_batched_tokens: 8192
  kv_cache_dtype: bf16
  attention_backend: flash_attn
  load_format: fastsafetensors
  served_model_name: qwen
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  enable_prefix_caching: true
  enable_chunked_prefill: true
  trust_remote_code: true
  enable_auto_tool_choice: true
  speculative_config: '{"method":"dflash","model":"z-lab/Qwen3.5-122B-A10B-DFlash","num_speculative_tokens":7}'

env:
  HF_HOME: /root/.cache/huggingface
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

patches:
  - patch_fla_shmem.py
  - patch_unify2.py
  - patch_prefix_align.py
  - patch_inc_hybrid.py
  - patch_int8_lmhead_v3.py

benchmark:
  framework: llama-benchy
  pp: [512]
  tg: [128]
  concurrency: [1, 2, 3]
  prefix_caching: true
  runs: 3
  results:
    model_load: "63.85 GiB, 36 seconds"
    kv_cache_tokens: 549001
    concurrency_at_256k: "2.09x"
    prefill_pp512: "827 tok/s"
    decode_tg128: "50.2 tok/s (peak 58.3)"
    free_ram: "~15 GB"

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --load-format {load_format} \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel}