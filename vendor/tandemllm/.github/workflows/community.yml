# Checks community weight packs (models/<model>/community/*.json, docs/community-weights.md) on every pull
# request that touches them: each file passes the registry's checks, and models/community-index.json is
# the index of the folders. The fix for a stale index is in the failure message.
name: community

on:
  pull_request:
    paths:
      - "models/**"
      - "server/setup/registry.py"
      - "server/setup/community.py"
  push:
    branches: [main]
    paths:
      - "models/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install the checker's one dependency
        run: python -m pip install pyyaml==6.0.2

      - name: Check the registry and the community packs
        run: python -m server.setup.registry --check

      - name: Check the index
        run: |
          python -m server.setup.community --index --check || {
            python -m server.setup.community --index >/dev/null
            echo "models/community-index.json or models/community-builtin.json differs from the folders. Regenerate and commit:"
            git --no-pager diff --stat -- models/community-index.json models/community-builtin.json
            exit 1
          }
