# Ornith-1.5-122B in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# Ornith's agentic and coding model on the Qwen3.5 mixture-of-experts architecture (engine/models/qwen3_5_moe), from our
# EXL3 pack, drafting with its own MTP layer (the public DFlash2 drafter for it is the other head). weights_gib: allocated at load (measured 2026-10-20). Window
# 262,144 tokens (max_position_embeddings); its KV is 24,576 bytes a token (12 attention layers, 2 KV heads of 256).
# One sequence slot: the joint verify of several slots is not built for this trunk yet. Rows of the measured table come
# from real runs only.
schema: 1
id: ornith-1.5-122b
name: Ornith-1.5-122B
family: Ornith 1.5
params: ~122B, ~10B active a token
recommended: false
order: 7
pitch: An agentic and coding mixture-of-experts model on the Qwen3.5 architecture that reads images too, from our EXL3 pack.
architecture: 48 layers, 36 Gated DeltaNet and 12 gated attention layers, each with a mixture of 256 experts of which 8 and
  a shared one run a token, plus one multi-token-prediction layer; it thinks in a <think> block and calls tools in the XML
  form. Images go through its Qwen3.5 vision tower (27 blocks), in the pack at 6 bits.
license: The model's license (MIT) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
- label: Model card
  url: https://huggingface.co/ornith-ai/Ornith-1.5-122B
- label: DFlash2 drafter
  url: https://huggingface.co/incoai/Ornith-1.5-122B-DFlash2
devices:
- id: dgx-spark
  label: NVIDIA DGX Spark (128 GB unified memory)
  total_gib: 121.63
  reserved_gib: 10.0
  note: The GPU and the CPU share this memory. MemTotal reads 121.6 GiB of the 128 GB.
assets:
- id: ornith-dflash2
  label: DFlash2 drafter for Ornith-1.5-122B
  path: ${HOME}/models/ornith-1.5-122b-dflash2/model.safetensors
  also: []
  fetchable: true
  protected: false
  hf_repo: incoai/Ornith-1.5-122B-DFlash2
  fetch:
  - repo: incoai/Ornith-1.5-122B-DFlash2
    files:
    - config.json
    - model.safetensors
    to: ${HOME}/models/ornith-1.5-122b-dflash2
    gb: 1.86
  source: Public on Hugging Face (Apache-2.0), BF16; the engine reads it as stored (engine/models/qwen3_5_moe/dflash2.py).
- id: qwen3.5-2b
  label: Qwen3.5-2B (the narrator, and Wren)
  path: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b/config.json
  also: []
  fetchable: true
  protected: false
  hf_repo: Qwen/Qwen3.5-2B
  fetch:
  - repo: Qwen/Qwen3.5-2B
    files:
    - '*.json'
    - '*.safetensors'
    - '*.jinja'
    - merges.txt
    - LICENSE
    to: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
    gb: 4.57
  source: Public on Hugging Face; install.sh --setup downloads it for Wren, the fetch step when the narrator is on (VIS-153).
- id: laya
  label: Laya decision models
  path: ${HOME}/.qwen38-spark-engine/deciders/laya/model.safetensors
  also: []
  fetchable: true
  protected: false
  hf_repo: convaiinnovations/laya
  fetch:
  - repo: convaiinnovations/laya
    files:
    - config.json
    - rl_agent_config.json
    - model.safetensors
    - encoder/*
    - tokenizer/*
    - multilingual/*
    - typed-decisions/*
    to: ${HOME}/.qwen38-spark-engine/deciders/laya
    gb: 2.35
  source: Public on Hugging Face (no token needed); the fetch step downloads its three models when Laya is on (VIS-153). Its
    Python files are not downloaded.
