# The measured table: build 0.6.2, 2026-10-10, raw engine server, caches off, one request at a time.
# A cell is [tok/s mean, tok/s min, ms a round, tokens a round, n] (long rows add the TTFT in s).
# measurements/0.6.2-summary.json is the run's own summary (spark ~/exl3-measure-20261010).
measurements:
  build: "0.6.2"
  date: "2026-10-10"
  method: >-
    tools/exl3_fastrun.py, one raw-engine server per run, prompts prose / chat / code, 3 reps,
    temperature 0 (greedy) or 0.7 with top-p 0.95 (sampled), thinking off, 128 or 512 new tokens,
    2 runs a mode (6 decodes a cell); long rows: the code task after 32k / 64k tokens of held-out
    text, one text a cell; lossless: tools/exl3_lossless.py, 12 traces of 256 tokens against the
    size's own greedy decode. Caches, the conductor and the small models off; 4 slots of 262,144
    tokens with the KV pool on. Chat and long rows are one prompt a cell: read them as "smaller is
    faster", not as an order between neighbours.
  source: kernel note "2026-10-10, build 0.6.2" (raw data spark ~/exl3-measure-20261010/summary.json)
  rows:
