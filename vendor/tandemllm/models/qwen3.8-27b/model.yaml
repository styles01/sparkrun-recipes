# The engine's own parts beside the weights and the drafters, the same for every EXL3 size (load
# stages of 2026-10-10, GiB allocated): what the estimate adds before any tool. The CUDA graphs are
# slot 0's only: a side slot captures its own (about 7.5 GiB) only with QSE_SIDE_GRAPHS on, and the
# setup writes it off (parallelism.fixed), so a side slot costs side_slot_const_gib and its KV.
memory:
  parts:
    - {id: graphs, label: CUDA graphs (the verify step), gib: 6.63, kind: fixed, source: "load stage graphs, 0.6.2 (6.61 to 6.65 over the six sizes)"}
    - {id: engine, label: Engine state and warm-up workspace, gib: 1.28, kind: fixed, source: "load stages engine 0.14 + warmup 1.14, 0.6.2"}
    - {id: allocator, label: Allocator reserve, gib: 2.6, kind: reserve, source: "memory.split reserve 2.62 GiB, 2026-10-10 22:30 (RESERVE_SLACK_GIB 2 is its target between requests)"}
  sources:
    - docs/operations.md "Memory rules"
    - docs/parallel-requests.md "The shared KV pool"
    - kernel note "2026-10-10, build 0.6.2", the load stages of every size
    - memory.split of /v1/dashboard/system, 2026-10-10 22:30 (exl3-6.0, 4 slots, the small models loaded)

# The tools that run beside the model. default: on in the recommended setup (what the reference box
# serves). knobs: serve.env key -> its value with the tool on and off; null writes nothing for that
# state (the profile's value stands: the disk tier's folder is per profile). memory_gib: what it
# holds loaded (the live memory split); memory_max_gib: what it may grow to; elastic: given back
# first when the conversations need memory. assets: what must be on disk for it to load.
components:
  - id: drafters
    label: Draft models
    group: speed
    what: Two small models guess the next tokens, and the big model checks the guesses in one pass. Most of the speed comes from here.
    default: true
    required: true
    memory_gib: 5.41
    memory_max_gib: null
    elastic: false
    disk_gb: 4.0
    depends_on: []
    conflicts: []
    knobs: {}
    assets: []
    docs: docs/speculative-decoding.md
    note: The weight profile picks which draft models load. Their memory is the profile's drafters_gib, and their context KV is part of the 104.25 KiB a token below.
  - id: lookup
    label: Lookup store
    group: speed
    what: Remembers what the model read and wrote before and suggests it again when text repeats, like code you edit many times.
    default: true
    required: false
    memory_gib: 0.19
    memory_max_gib: null
    elastic: false
    disk_gb: 0.2
    depends_on: []
    conflicts: []
    knobs:
      QWEN38_SUFFIX_STORE: {"on": "${HOME}/.qwen38-spark-engine/suffix", "off": ""}
    assets: []
    docs: docs/speculative-decoding.md
    note: 192 MiB of token ids at most (--suffix-store-mb), in host memory.
  - id: conductor
    label: Conductor
    group: features
    what: Gives each request the right instructions and helper packages, and watches long sessions so they do not get stuck.
    default: true
    required: false
    memory_gib: 0.0
    memory_max_gib: null
    elastic: false
    disk_gb: 0.1
    depends_on: []
    conflicts: []
    knobs:
      CONDUCTOR: {"on": "on", "off": "raw"}
      QSE_CONDUCTOR_CONFIG: {"on": "${HOME}/.qwen38-spark-engine/conductor", "off": "off"}
    assets: []
    docs: docs/server.md
    note: Off, clients talk to the raw engine and the small models below have nothing to do.
  - id: narrator
    label: Narrator
    group: roles
    what: A small model that writes short status lines while the big model thinks, so you can see what it is doing.
    default: false
    required: false
    memory_gib: 3.6
    memory_max_gib: null
    elastic: true
    disk_gb: 4.3
    depends_on: [conductor]
    conflicts: []
    knobs:
      QWEN38_NARRATOR_MODEL: {"on": "qwen3.5-2b", "off": ""}
      QWEN38_NARRATOR_DIR: {"on": "${HOME}/.qwen38-spark-engine/models/qwen3.5-2b", "off": ""}
    assets: [qwen3.5-2b]
    docs: docs/server.md
    note: Qwen3.5-2B, 3.60 GiB in the live memory split. When memory runs short it goes after the shadow reader and loads again later. Off by default since 0.11.3 (SRV-534); turned on, it serves the model, and the lines come with the roles document's narrator mode and a profile's ui.narrator.
  - id: laya
    label: Laya decision models
    group: roles
    what: Three tiny classifiers that answer the conductor's quick questions, like what kind of request this is, in milliseconds.
    default: true
    required: false
    memory_gib: 1.6
    memory_max_gib: null
    elastic: false
    disk_gb: 2.3
    depends_on: [conductor]
    conflicts: []
    knobs:
      QWEN38_DECIDER_MODELS: {"on": "laya-english,laya-multilingual,laya-typed-decisions", "off": ""}
    assets: [laya]
    docs: docs/server.md
    note: Without them the big model answers those questions itself, which costs a turn each time.
  - id: shadow
    label: Shadow reader
    group: roles
    what: A small model that reads along with each session when the box is idle, so later questions about it are answered fast.
    default: true
    required: false
    memory_gib: 1.52
    memory_max_gib: 5.52
    elastic: true
    disk_gb: 1.7
    depends_on: [conductor]
    conflicts: []
    knobs:
      QWEN38_SHADOW_MODEL: {"on": "qwen3.5-0.8b", "off": ""}
    assets: [qwen3.5-0.8b]
    docs: docs/shadow-reader.md
    note: Qwen3.5-0.8B (1.52 GiB in the live memory split) and up to 4 GiB of session states (QWEN38_SHADOW_GB). The first to unload when memory runs short.
  - id: vision
    label: Vision
    group: features
    what: Lets the model read images you send with a message.
    default: true
    required: false
    memory_gib: 0.86
    memory_max_gib: 1.36
    elastic: false
    disk_gb: 0.0
    depends_on: []
    conflicts: []
    knobs:
      VISION: {"on": "on", "off": "off"}
    assets: []
    docs: docs/server.md
    note: The tower ships inside the base checkpoint. The extra 0.5 GiB is the cache of encoded images (--image-cache-mb 512).
  - id: prompt_cache
    label: Conversation cache
    group: caches
    what: Keeps the conversation the model is in, so the next turn starts where the last one ended instead of reading everything again.
    default: true
    required: false
    memory_gib: 0.43
    memory_max_gib: 11.5
    elastic: true
    disk_gb: 0.0
    depends_on: []
    conflicts: []
    knobs:
      RESIDENT_GB: {"on": "2.5", "off": "0"}
    assets: []
    docs: docs/caches.md
    note: The resident prefix, 0.43 GiB in the live memory split. At their caps the anchors take 2.5 GiB, the stash 1, the pin 4 and the park 4. Off, every agent turn reads its whole prompt again.
  - id: state_store
    label: State store
    group: caches
    what: Saves the model's state after short chats, so the same start a second time costs nothing.
    default: true
    required: false
    memory_gib: 0.49
    memory_max_gib: 2.0
    elastic: true
    disk_gb: 0.0
    depends_on: []
    conflicts: []
    knobs:
      CACHE_GB: {"on": "2", "off": "0"}
    assets: []
    docs: docs/caches.md
    note: null
  - id: response_cache
    label: Response cache
    group: caches
    what: Answers an identical greedy request again from memory, without running the model.
    default: false
    required: false
    memory_gib: 0.25
    memory_max_gib: null
    elastic: false
    disk_gb: 0.0
    depends_on: []
    conflicts: []
    knobs:
      RESPONSE_CACHE: {"on": "on", "off": "off"}
    assets: []
    docs: docs/caches.md
    note: Off on the reference box. Useful for scripts that send the same request many times; never for a benchmark.
  - id: disk_tier
    label: Disk cache
    group: disk
    what: Keeps the start of long prompts on the SSD, so a long agent session or a returning chat starts in seconds.
    default: true
    required: false
    memory_gib: 0.0
    memory_max_gib: null
    elastic: false
    disk_gb: 16.0
    depends_on: []
    conflicts: []
    knobs:
      QSE_DISK_CACHE: {"on": null, "off": "off"}
    assets: []
    docs: docs/caches.md
    note: 16 GB by default (the Memory screen sets it), in a folder per weight profile. It never takes the disk under 50 GB free.
  - id: nvme_spill
    label: Session spill
    group: disk
    what: Moves a paused conversation to the SSD instead of dropping it, and brings it back on its next turn.
    default: true
    required: false
    memory_gib: 0.0
    memory_max_gib: null
    elastic: false
    disk_gb: 64.0
    depends_on: [disk_tier]
    conflicts: []
    knobs:
      SESSION_SPILL: {"on": "on", "off": "off"}
    assets: []
    docs: docs/caches.md
    note: Compressed, up to SESSION_SPILL_GB (64 GB), inside the disk cache's folder.
  - id: proxy
    label: Other backends
    group: features
    what: Lets the dashboard send some model names to other servers or cloud APIs, beside this engine.
    default: false
    required: false
    memory_gib: 0.0
    memory_max_gib: null
    elastic: false
    disk_gb: 0.0
    depends_on: []
    conflicts: []
    knobs:
      QSE_BACKENDS: {"on": "${HOME}/.qwen38-spark-engine/backends/config.sqlite3", "off": ""}
    assets: []
    docs: docs/proxy.md
    note: You add the backends later, on the Backends screen.

# Parallel requests and the KV memory. kv_bytes_per_token: server/slots.py slot_bytes, 106,752 bytes
# = 104.25 KiB = 106.75 kB a token of window: 64 KiB of engine attention KV (16 full-attention
# layers x 4 KV heads x head_dim 256 x K and V x 2 bytes), 2 x 20 KiB of drafter context KV (5
# layers x 8 KV heads x 128 x 2 x 2 bytes, one per arm) and 256 B of rotary table (64 dims, cos and
# sin, bf16). docs/operations.md said "106.5 KiB" and "27.9 GB at 262,144 tokens": the GB figure is
# right (27.98 GB = 26.06 GiB), the KiB one was the kB figure with the wrong unit (fixed with this
# file). side_slot_const_gib: a side slot beyond its window with its verify graphs off (load stage
# side_slots 3.58 GiB for three, 2026-10-10). typical_fill_tokens: what one slot's conversation
# holds in the estimate's "typical" case; with the KV pool on, pages are committed only as a
# conversation writes them.
parallelism:
  slots: {min: 1, max: 4, default: 4}
  window: {min: 8192, max: 262144, default: 262144, step: 8192}
  side_window: {min: 8192, max: 262144, default: 262144, step: 8192}
  kv_pool: {default: true}
  floor_gb: {min: 10, max: 40, default: 15}
  kv_hard_floor_gb: 10
  kv_bytes_per_token: 106752
  typical_fill_tokens: 32768
  side_slot_const_gib: 1.19
  knobs:
    slots: QSE_PARALLEL
    window: MAX_LEN
    side_window: QSE_SIDE_MAX_LEN
    kv_pool: QSE_KV_POOL
    floor_gb: QSE_PARALLEL_FLOOR_GB
  # written with every selection: side slots without their own verify graphs (1.19 instead of about
  # 7.5 GiB each), the pool's hard floor and the barrier fix of SRV-311, as the reference box runs
  fixed:
    QSE_SIDE_GRAPHS: "off"
    QSE_SIDE_SLOT_CONST_GB: "1.5"
    QSE_KV_HARD_FLOOR_GB: "10"
    QSE_BARRIER_IDLE_OWNER: "on"

methods:
  - id: sampled_tree
    label: Sampled decoding
    what: How a request with a temperature is checked against the draft. det uses the same tree as a greedy request and is the fastest; the answers still follow the model's own sampling.
    type: enum
    options:
      - {value: det, label: "det: the tree (recommended)"}
      - {value: mixed, label: "mixed: the sampled chain in the tree"}
      - {value: chain, label: "chain: one sampled chain"}
    default: det
    recommended: det
    knob: SAMPLED_TREE
    docs: docs/speculative-decoding.md
  - id: reasoning_effort
    label: Thinking effort
    what: How long the model may think before it answers, when a client does not say.
    type: enum
    options:
      - {value: low, label: low}
      - {value: medium, label: medium}
      - {value: xhigh, label: extra high}
    default: medium
    recommended: medium
    knob: REASONING_EFFORT
    docs: docs/server.md
  - id: default_max_tokens
    label: Default answer length
    what: The longest answer, in tokens, when a client does not set max_tokens.
    type: int
    min: 1024
    max: 262144
    default: 32768
    recommended: 32768
    knob: DEFAULT_MAX_TOKENS
    docs: docs/server.md
  - id: draft_temperature
    label: Draft temperature
    what: How sharp the draft models' guesses are on a sampled request. Lower means fewer wrong guesses.
    type: number
    min: 0.05
    max: 1.0
    default: 0.3
    recommended: 0.3
    knob: QWEN38_DRAFT_TEMP
    docs: docs/speculative-decoding.md
  - id: request_timeout
    label: Request time limit
    what: Seconds one request may run before the engine stops it.
    type: int
    min: 60
    max: 14400
    default: 3600
    recommended: 3600
    knob: REQUEST_TIMEOUT
    docs: docs/server.md
  - id: max_queue
    label: Queue length
    what: How many requests may wait for a free slot before new ones are turned away.
    type: int
    min: 1
    max: 64
    default: 8
    recommended: 8
    knob: MAX_QUEUE
    docs: docs/server.md
  - id: queue_timeout
    label: Queue wait
    what: Seconds a request may wait in the queue before it gets an error.
    type: int
    min: 10
    max: 3600
    default: 240
    recommended: 240
    knob: QUEUE_TIMEOUT
    docs: docs/server.md

advanced:
  - id: port
    label: Port
    what: The port the API and the dashboard answer on.
    type: int
    min: 1024
    max: 65535
    default: 8000
    recommended: 8000
    knob: PORT
    docs: docs/operations.md
  - id: host
    label: Listen on
    what: The whole network, or only this machine.
    type: enum
    options:
      - {value: 0.0.0.0, label: the whole network}
      - {value: 127.0.0.1, label: this machine only}
    default: 0.0.0.0
    recommended: 0.0.0.0
    knob: HOST
    docs: docs/operations.md
  - id: served_model
    label: Raw engine name
    what: The model name of the raw engine. With the conductor on, clients see TandemLLM and this name is a hidden alias.
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
    default: qwen38-spark-engine
    recommended: qwen38-spark-engine
    knob: SERVED_MODEL
    docs: docs/server.md
  - id: dashboard_login
    label: Dashboard login
    what: With an admin password set, on makes the dashboard ask for it too.
    type: enum
    options:
      - {value: "off", label: "off"}
      - {value: "on", label: "on"}
    default: "off"
    recommended: "off"
    knob: QSE_DASHBOARD_LOGIN
    docs: docs/server.md
  - id: admin_password
    label: Admin password
    what: Without one, anyone who reaches the port can change the setup. Generate writes a random one into secrets.env on the box; read it there with cat.
    type: enum
    options:
      - {value: keep, label: keep as it is}
      - {value: generate, label: generate one}
    default: keep
    recommended: keep
    knob: null
    docs: docs/operations.md
