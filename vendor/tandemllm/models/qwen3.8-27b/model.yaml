# Qwen3.8-27B in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# One folder per base model under models/. The dashboard's setup guide (#/setup) reads this file
# through GET /v1/setup/models/qwen3.8-27b; server/setup/registry.py loads and checks it
# (`python -m server.setup.registry --check`), and tests/test_setup_registry.py holds it to the
# repository: every serve.env key named here is read by something (QWEN38_* in engine/settings.py,
# the others in ops/serve.env, a profile or ops/start.sh), every ops/profiles/<name>.env has an entry
# under `profiles`, and the measured table equals measurements/0.6.2-summary.json, the raw file.
#
# Memory figures are GiB (2^30 bytes), like the engine's knobs, whatever a key is called; disk
# figures are GB (10^9 bytes), like `df -H` and Hugging Face. Where a number comes from is said next
# to it: the `[memory] load stages` lines of the 0.6.2 runs of 2026-10-10 (GiB allocated, one per
# EXL3 size), the live memory split of the same evening (`memory.split` of /v1/dashboard/system on
# the reference box: 0.6.2, exl3-6.0, 4 slots of 262,144, the narrator, Laya and the shadow reader
# loaded; the parts below add up to its 59.34 GiB in use within 0.1 GiB) and docs/operations.md.
schema: 1
id: qwen3.8-27b
name: Qwen3.8-27B
family: Qwen3.8
params: 27B
recommended: true
pitch: A 27-billion-parameter model that reads images too, fast on one DGX Spark.
architecture: >-
  64 layers: 48 recurrent (Gated DeltaNet) and 16 full-attention, with a vision tower. TandemLLM
  runs it with two small draft models: they guess the next tokens and one pass of the big model
  checks them all, so a pass can keep several tokens. With greedy decoding the text is the model's
  own, up to near ties.
license: The model's license is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
  - {label: Base model, url: "https://huggingface.co/Qwen/Qwen3.8-27B-FP8"}
  - {label: NVFP4 weights, url: "https://huggingface.co/0xBakeer/TandemLLM-Qwen3.8-27B-NVFP4"}
  - {label: EXL3 weights, url: "https://huggingface.co/0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-4.5"}
  - {label: EXL3 draft models, url: "https://huggingface.co/0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters"}

# The device presets. total_gib: MemTotal (130,596,188,160 bytes on the reference box);
# reserved_gib: what the OS, the CUDA context and other programs take outside the engine's
# allocator (`outside` of the live memory split, 10.04 GiB on 2026-10-10).
devices:
  - id: dgx-spark
    label: NVIDIA DGX Spark (128 GB unified memory)
    total_gib: 121.63
    reserved_gib: 10.0
    note: The GPU and the CPU share this memory. MemTotal reads 121.6 GiB of the 128 GB.

# Files a profile or a tool needs besides the profile's own weights. fetchable: something in the
# repository downloads it. fetch: what ops/use-profile.sh downloads when the asset is missing (before
# the switch, with --fetch-only too; ops/fetch_weights.py --assets, OPS-95): each entry's `files` from
# the public Hugging Face `repo`, at the hub's commit of the day, into `to` with the repository's own
# folders kept (`${HF_HUB}`: the Hugging Face cache, where the engine reads the base), every LFS file
# checked against the hub's sha256; `gb` is the download's size (10^9 bytes) for the disk check and
# the plan. protected: reset level 4 never deletes it. A path may end in a glob.
assets:
  - id: exl3-drafters-k3
    label: Draft models (EXL3 K3)
    path: ${HOME}/.qwen38-spark-engine/weights/exl3-drafters-k3/ft-b8-v2.safetensors
    also: ["${HOME}/.qwen38-spark-engine/weights/exl3-drafters-k3/ft-b16.safetensors"]
    fetchable: true
    protected: true
    hf_repo: 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters
    fetch:
      - repo: 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters
        files: [exl3-drafters-k3/ft-b8-v2.safetensors, exl3-drafters-k3/ft-b16.safetensors]
        to: ${HOME}/.qwen38-spark-engine/weights
        gb: 1.3
    source: Converted on the reference box (ENG-215) and published in 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters (exl3-drafters-k3/). Each file holds one drafter's projections; the drafter's BF16 checkpoint (nvfp4-drafters) gives the rest.
  - id: exl3-draft-head-k4
    label: Draft head (EXL3 K4)
    path: ${HOME}/.qwen38-spark-engine/weights/exl3-draft-head-k4/model.safetensors
    also: []
    fetchable: true
    protected: true
    hf_repo: 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters
    fetch:
      - repo: 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters
        files: [exl3-draft-head-k4/model.safetensors, exl3-draft-head-k4/source-config.json]
        to: ${HOME}/.qwen38-spark-engine/weights
        gb: 0.64
    source: Converted on the reference box (ENG-215) and published in 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-drafters (exl3-draft-head-k4/).
  - id: base-fp8
    label: Base checkpoint (Qwen3.8-27B-FP8)
    path: ${HF_HUB}/models--Qwen--Qwen3.8-27B-FP8/snapshots/*/config.json
    also: []
    fetchable: true
    protected: true
    hf_repo: Qwen/Qwen3.8-27B-FP8
    fetch:
      - repo: Qwen/Qwen3.8-27B-FP8
        files: ["*.json", "*.jinja", merges.txt, LICENSE, layers-*.safetensors, outside.safetensors]
        to: ${HF_HUB}
        gb: 30.4
    source: Public on Hugging Face. Every 27B profile reads its embeddings, norms, the tensors the quantised weights leave and the tokenizer; not mtp.safetensors (the 27B drafts with its own drafters). install.sh downloads it, except with --setup; use-profile.sh downloads it when it is missing (NVFP4; the EXL3 profiles need base-plain, which it serves for).
  - id: base-plain
    label: Base tensors for EXL3 (Qwen3.8-27B-FP8 without its FP8 projections)
    path: ${HOME}/.qwen38-spark-engine/weights/base-plain/config.json
    also: ["${HOME}/.qwen38-spark-engine/weights/base-plain/outside.safetensors"]
    satisfied_by: [base-fp8]
    fetchable: true
    protected: true
    hf_repo: Qwen/Qwen3.8-27B-FP8
    fetch:
      - repo: Qwen/Qwen3.8-27B-FP8
        files: ["*.json", "*.jinja", merges.txt, LICENSE, layers-*.safetensors, outside.safetensors]
        to: ${HOME}/.qwen38-spark-engine/weights/base-plain
        gb: 3.54
        skip_dtypes: [F8_E4M3]
        skip_tensors: [lm_head.weight]
    source: "OPS-133: the tensors of Qwen/Qwen3.8-27B-FP8 an EXL3 load reads, fetched by range requests: the embedding, the norms, the GDN gates and convolutions, the vision tower, the config and the tokenizer (3.54 GB of 30.41). Left out: the F8_E4M3 projections with their scales (24.33 GB) and lm_head.weight (2.54 GB), which every EXL3 pack here quantises (tests/test_base_plain.py). A box with base-fp8 uses that instead."
  - id: nvfp4-drafters
    label: Draft models (DFlash2 b8 and b16, BF16)
    path: ${REPO}/train/ft-b8-v2
    also: ["${REPO}/train/ft-b16"]
    fetchable: true
    protected: true
    hf_repo: 0xBakeer/TandemLLM-Qwen3.8-27B-DFlash2-b8
    fetch:
      - repo: 0xBakeer/TandemLLM-Qwen3.8-27B-DFlash2-b8
        files: [config.json, model.safetensors]
        to: ${REPO}/train/ft-b8-v2
        gb: 3.85
      - repo: 0xBakeer/TandemLLM-Qwen3.8-27B-DFlash2-b16
        files: [config.json, model.safetensors]
        to: ${REPO}/train/ft-b16
        gb: 3.85
    source: The 0.4.8 release's drafters (DFlash2-b8 and -b16 on Hugging Face, BF16), read from the repository's train/ folder (CKPT8, CKPT16). The NVFP4 profile quantises their projections at load; an EXL3 profile replaces them with the K3 files, named after these folders.
  - id: qwen3.5-2b
    label: Qwen3.5-2B (the narrator, and Wren)
    path: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b/config.json
    also: []
    fetchable: true
    protected: false
    hf_repo: Qwen/Qwen3.5-2B
    fetch:
      - repo: Qwen/Qwen3.5-2B
        files: ["*.json", "*.safetensors", "*.jinja", merges.txt, LICENSE]
        to: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
        gb: 4.57
    source: Public on Hugging Face; install.sh --setup downloads it for Wren, the fetch step when the narrator is on (VIS-153).
  - id: qwen3.5-0.8b
    label: Qwen3.5-0.8B (the shadow reader)
    path: ${HOME}/.qwen38-spark-engine/models/qwen3.5-0.8b/config.json
    also: []
    fetchable: true
    protected: false
    hf_repo: Qwen/Qwen3.5-0.8B
    fetch:
      - repo: Qwen/Qwen3.5-0.8B
        files: ["*.json", "*.safetensors", "*.jinja", merges.txt, LICENSE]
        to: ${HOME}/.qwen38-spark-engine/models/qwen3.5-0.8b
        gb: 1.77
    source: Public on Hugging Face; the fetch step downloads it when the shadow reader is on (VIS-153).
  - id: laya
    label: Laya decision models
    path: ${HOME}/.qwen38-spark-engine/deciders/laya/model.safetensors
    also: []
    fetchable: true
    protected: false
    hf_repo: convaiinnovations/laya
    fetch:
      - repo: convaiinnovations/laya
        files: [config.json, rl_agent_config.json, model.safetensors, "encoder/*", "tokenizer/*", "multilingual/*", "typed-decisions/*"]
        to: ${HOME}/.qwen38-spark-engine/deciders/laya
        gb: 2.35
    source: Public on Hugging Face (no token needed); the fetch step downloads its three models when Laya is on (VIS-153). Its Python files are not downloaded.

# One entry per ops/profiles/<id>.env. weights_gib: the target's weights on the device (load stage
# `weights`, GiB allocated); drafters_gib: the draft models, the draft head and their buffers (load
# stage `drafters`, with the KV pool on, so without their per-token KV); disk_gb: QSE_WEIGHTS_GB of
# the profile file. Quality: our engine against the BF16 checkpoint on the 8 held-out rows of the
# calibration repo (16,376 scored positions), kernel note "2026-10-09 00:50 CEST".
quality_source: &qsrc "kernel note 2026-10-09 00:50, tools/exl3_eval.py against BF16, 8 held-out rows"
profiles:
  - id: exl3-2.5
    label: EXL3 2.5 bpw
    format: exl3
    bpw: 2.5
    disk_gb: 12.0
    weights_gib: 10.15
    drafters_gib: 5.41
    hf_repo: 0xBakeer/TandemLLM-Qwen3.8-27B-EXL3-2.5
    hf_private: false
    made_by: {kind: ours, name: 0xBakeer, github: 0xBakeer}
    recommended: false
    badges: [fastest]
    quality: {kl_vs_bf16: 0.2121, top1_pct: 86.27, ppl: 3.1187, date: "2026-10-09", source: *qsrc}
    assets_required: &exl3assets [exl3-drafters-k3, exl3-draft-head-k4, nvfp4-drafters, base-plain]
