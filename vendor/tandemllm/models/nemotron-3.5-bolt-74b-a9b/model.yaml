# NVIDIA Nemotron 3.5 Bolt 74B-A9B in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# NVIDIA's hybrid Mamba2 / mixture-of-experts model for 24 GB, served from NVIDIA's own GGUF (IQ2_XXS experts,
# NVFP4 Mamba2 projections, Q8_0 head and attention) read as stored (engine/models/nemotron_h, docs/nemotron-h.md),
# or from our EXL3 packs of the BF16 checkpoint. Profile ops/profiles/nemotron-bolt-iq2.env: its config and tokenizer
# from the BF16 repository, the GGUF an asset fetched from NVIDIA's repository at a pinned revision, never re-hosted;
# ops/profiles/nemotron-bolt-exl3-<bpw>.env (2.0 to 6.0): each pack's own public repository. weights_gib: allocated at load
# (measured 2026-10-15). max_window: the model's whole context, 262,144 tokens: its KV is 8,192 bytes a token (8
# attention layers, 2 KV heads of 128), 2 GiB at the full window. Rows of the measured table come from real runs only.
schema: 1
id: nemotron-3.5-bolt-74b-a9b
name: Nemotron 3.5 Bolt 74B-A9B
family: Nemotron 3.5
params: ~74B, ~9B active a token
recommended: true
order: 5
pitch: NVIDIA's 74B hybrid Mamba2 and mixture-of-experts model in 23 GB, from EXL3 packs at 2.0 to 6.0 bpw or NVIDIA's 2-bit GGUF.
architecture: 88 layers, 40 Mamba2, 40 mixture-of-experts (240 to 496 experts a layer, 9 a token, one shared, a
  1,024-wide latent) and 8 attention layers without positional encoding; it thinks in a <think> block and calls
  tools in the XML form. Text only in TandemLLM so far (the image tower is not served).
license: The model's license (OpenMDW-1.1) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
