measurements:
  build: 0.11.1
  date: '2026-10-16'
  method: >-
    the prose, chat and code asks of tools/fn_lookup_ab.py, one request at a time through one fresh server a run on
    the DGX Spark, the GPU to itself: greedy, thinking off, 512 new tokens; tok/s and tokens a round are the
    server's own timings. The profile's drafting (EXL3: NVIDIA's LiLiCorr drafter and the lookup; IQ2: the lookup
    alone; the cut by StairCut with the release's price files), 3 slots, conductor raw, caches and the suffix store
    off, max_len 32,768. Three runs a cell, alternating with plain servers (--drafter none, the same shape); every
    drafted text is the plain run's. Measured on the 0.11.1 tree before its version bump. Not measured yet: sampled,
    128 tokens, long context, first-token times. Raw data:
