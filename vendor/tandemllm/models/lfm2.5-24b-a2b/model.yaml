memory:
  parts:
  - id: engine
    label: Engine state, the decode graphs and warm-up
    gib: 1.6
    kind: fixed
    source: 'measured on 4.0, 2026-10-14: the load stages engine, drafters and warm-up took 0.68, 0.67 and 0.27 GiB of
      MemAvailable beyond the weights (server [memory] line); a decode run peaked 0.37 GiB allocated above them'
  - id: allocator
    label: Allocator reserve
    gib: 1.5
    kind: reserve
    source: an estimate until measured on the Spark (SPD-107)
  sources:
  - engine/models/lfm2_moe/pack.py decode_bytes (BF16 checkpoint headers, 2026-10-14)
  per_window_parts:
  - id: prefill_workspace
    label: Prefill workspace (a 4,096-token chunk's activations and the attention's keys)
    bytes_per_token: 8192
    max_gib: 3.0
    kind: reserve
    source: 'an estimate until measured (SPD-107): the chunk''s keys and values repeated for the 32 query heads
      grow with the context (8 KiB a token over the 10 layers, one at a time), the chunk''s own activations are
      fixed'
components:
- id: conductor
  label: Conductor
  group: features
  what: Gives each request the right instructions and helper packages, and watches long sessions so they do not
    get stuck.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.1
  depends_on: []
  conflicts: []
  knobs:
    CONDUCTOR:
      'on': 'on'
      'off': raw
    QSE_CONDUCTOR_CONFIG:
      'on': ${HOME}/.qwen38-spark-engine/conductor
      'off': 'off'
  assets: []
  docs: docs/server.md
  note: 'On by default, with the model fit its adapter declares (SRV-441): Laya alone answers the class
    question, a turn nobody classified thinks at the profile''s default level with nothing added, and a class sets
    the level and budget with only its core skill in the note: no other package, rule, effort sentence or memory
    note. Measured on 2.5, 2026-10-14: four short chat asks thought 2,234 tokens against 2,155 raw (the router as
    written: 9,098); seven Chat-tab tasks, two runs each, succeeded 14 of 14 as raw did.'
- id: narrator
  label: Narrator
  group: roles
  what: A small model that writes short status lines while the big model thinks, so you can see what it is doing.
  default: false
  required: false
  memory_gib: 3.6
  memory_max_gib: null
  elastic: true
  disk_gb: 4.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_NARRATOR_MODEL:
      'on': qwen3.5-2b
      'off': ''
    QWEN38_NARRATOR_DIR:
      'on': ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
      'off': ''
  assets:
  - qwen3.5-2b
  docs: docs/server.md
  note: Qwen3.5-2B, 3.60 GiB in the live memory split. When memory runs short it goes after the shadow reader and
    loads again later. Off by default since 0.11.3 (SRV-534); turned on, it serves the model, and the lines come with the roles document's narrator mode and a profile's ui.narrator.
- id: laya
  label: Laya decision models
  group: roles
  what: Three tiny classifiers that answer the conductor's quick questions, like what kind of request this is, in
    milliseconds.
  default: true
  required: false
  memory_gib: 1.6
  memory_max_gib: null
  elastic: false
  disk_gb: 2.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_DECIDER_MODELS:
      'on': laya-english,laya-multilingual,laya-typed-decisions
      'off': ''
  assets:
  - laya
  docs: docs/server.md
  note: The class question's only answer on this model (its own one-word answers are no class); without them
    every turn falls back to the profile's default level.
- id: response_cache
  label: Response cache
  group: caches
  what: Answers an identical greedy request again from memory, without running the model.
  default: false
  required: false
  memory_gib: 0.25
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESPONSE_CACHE:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Off on the reference box. Useful for scripts that send the same request many times; never for a benchmark.
- id: proxy
  label: Other backends
  group: features
  what: Lets the dashboard send some model names to other servers or cloud APIs, beside this engine.
  default: false
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    QSE_BACKENDS:
      'on': ${HOME}/.qwen38-spark-engine/backends/config.sqlite3
      'off': ''
  assets: []
  docs: docs/proxy.md
  note: You add the backends later, on the Backends screen.
- id: prompt_cache
  label: Conversation cache
  group: caches
  what: Keeps the conversation the model is in, so the next turn starts where the last one ended instead of reading
    everything again.
  default: true
  required: false
  memory_gib: 0.16
  memory_max_gib: 2.5
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESIDENT_GB:
      'on': '2.5'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: The resident prefix with its anchors every 4,096 tokens (the prefill's chunk), the end anchor, the pin and
    the park; an anchor is 80.2 MiB (240 KiB of convolution inputs and 4,096 tokens of KV at 20,480 bytes).
- id: state_store
  label: State store
  group: caches
  what: Saves the model's state after short chats, so the same start a second time costs nothing.
  default: true
  required: false
  memory_gib: 0.49
  memory_max_gib: 2.0
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    CACHE_GB:
      'on': '2'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: null
parallelism:
  # three sequence slots (SPD-107, measured on 4.0, 2026-10-14): 1, 2 and 3 requests at once decoded 139.9, 169.1
  # and 177.8 tok/s in total, each text its request's alone
  slots:
    min: 1
    max: 3
    default: 3
  window:
    min: 8192
    max: 131072
    default: 131072
    step: 4096
  side_window:
    min: 8192
    max: 131072
    default: 131072
    step: 4096
  kv_pool:
    default: false
  floor_gb:
    min: 10
    max: 40
    default: 15
  kv_hard_floor_gb: 10
  kv_bytes_per_token: 20480
  typical_fill_tokens: 32768
  side_slot_const_gib: 0.0
  knobs:
    slots: QSE_PARALLEL
    window: MAX_LEN
    side_window: QSE_SIDE_MAX_LEN
    kv_pool: QSE_KV_POOL
    floor_gb: QSE_PARALLEL_FLOOR_GB
  fixed: {}
methods:
- id: temperature
  label: Temperature
  what: How random the answers are when a client does not say. Liquid recommends 0.1 for this model.
  type: number
  min: 0
  max: 2
  default: 0.1
  recommended: 0.1
  knob: TEMPERATURE
  docs: docs/lfm2.5-24b-a2b.md
- id: top_k
  label: Top-k
  what: How many of the likeliest next tokens a sampled answer draws from, when a client does not say.
  type: int
  min: 0
  max: 1000
  default: 50
  recommended: 50
  knob: TOP_K
  docs: docs/lfm2.5-24b-a2b.md
- id: repetition_penalty
  label: Repetition penalty
  what: How much the model is kept from repeating itself, when a client does not say. 1 is off.
  type: number
  min: 1
  max: 2
  default: 1.05
  recommended: 1.05
  knob: REP_PENALTY
  docs: docs/lfm2.5-24b-a2b.md
- id: default_max_tokens
  label: Default answer length
  what: The longest answer, in tokens, when a client does not set max_tokens.
  type: int
  min: 1024
  max: 262144
  default: 32768
  recommended: 32768
  knob: DEFAULT_MAX_TOKENS
  docs: docs/server.md
- id: request_timeout
  label: Request time limit
  what: Seconds one request may run before the engine stops it.
  type: int
  min: 60
  max: 14400
  default: 3600
  recommended: 3600
  knob: REQUEST_TIMEOUT
  docs: docs/server.md
- id: max_queue
  label: Queue length
  what: How many requests may wait for a free slot before new ones are turned away.
  type: int
  min: 1
  max: 64
  default: 8
  recommended: 8
  knob: MAX_QUEUE
  docs: docs/server.md
- id: queue_timeout
  label: Queue wait
  what: Seconds a request may wait in the queue before it gets an error.
  type: int
  min: 10
  max: 3600
  default: 240
  recommended: 240
  knob: QUEUE_TIMEOUT
  docs: docs/server.md
advanced:
- id: port
  label: Port
  what: The port the API and the dashboard answer on.
  type: int
  min: 1024
  max: 65535
  default: 8000
  recommended: 8000
  knob: PORT
  docs: docs/operations.md
- id: host
  label: Listen on
  what: The whole network, or only this machine.
  type: enum
  options:
  - value: 0.0.0.0
    label: the whole network
  - value: 127.0.0.1
    label: this machine only
  default: 0.0.0.0
  recommended: 0.0.0.0
  knob: HOST
  docs: docs/operations.md
- id: served_model
  label: Raw engine name
  what: The model name of the raw engine. With the conductor on, clients see TandemLLM and this name is a hidden
    alias.
  type: string
  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
  default: qwen38-spark-engine
  recommended: qwen38-spark-engine
  knob: SERVED_MODEL
  docs: docs/server.md
- id: dashboard_login
  label: Dashboard login
  what: With an admin password set, on makes the dashboard ask for it too.
  type: enum
  options:
  - value: 'off'
    label: 'off'
  - value: 'on'
    label: 'on'
  default: 'off'
  recommended: 'off'
  knob: QSE_DASHBOARD_LOGIN
  docs: docs/server.md
- id: admin_password
  label: Admin password
  what: Without one, anyone who reaches the port can change the setup. Generate writes a random one into secrets.env
    on the box; read it there with cat.
  type: enum
  options:
  - value: keep
    label: keep as it is
  - value: generate
    label: generate one
  default: keep
  recommended: keep
  knob: null
  docs: docs/operations.md
