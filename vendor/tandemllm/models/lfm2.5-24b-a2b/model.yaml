# LFM2.5-24B-A2B in TandemLLM: the setup guide's registry entry (docs/setup.md, VIS-125). Schema 1.
#
# LiquidAI's 24B mixture-of-experts chat model (engine/models/lfm2_moe, ENG-E10), from its BF16 checkpoint or
# one of our EXL3 packs (exllamav3 1.6.0, mul1 codebook, the same sizes as the 27B's), one profile each
# (ops/profiles/lfm25-<variant>.env). weights_gib: allocated at load (BF16 and 4.0, measured 2026-10-14); the
# other packs' from the parameter count (the 0.26 B embedding at 16 bits, the head at 6, the rest at the
# pack's rate) until each pack is measured. max_window: the model's whole context, 131,072 tokens: its KV is 20,480
# bytes a token (10 attention layers, 8 KV heads of 64), 2.5 GiB at the full window, so every profile fits
# the Spark preset at it. No draft head yet (Liquid will publish one): the lookup alone drafts; no vision tower
# (the model reads text). Rows of the measured table come from real runs only.
schema: 1
id: lfm2.5-24b-a2b
name: LFM2.5-24B-A2B
family: LFM2.5
params: ~24B, ~2B active a token
recommended: false
# after the two Qwen3.8 models on the models step
order: 10
pitch: LiquidAI's fast chat model, a mixture of 64 experts with short convolutions, about 2B parameters a token.
architecture: 40 layers, 30 double-gated short convolutions and 10 grouped-query attention layers, with a mixture of
  64 experts of which 4 run a token in 38 of them (two dense layers first); it always thinks before it answers and
  calls tools in a Pythonic list.
license: The model's license (LFM Open License v1.0) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or
  commercial.
icon: null
links:
- label: Model card
  url: https://huggingface.co/LiquidAI/LFM2.5-24B-A2B
