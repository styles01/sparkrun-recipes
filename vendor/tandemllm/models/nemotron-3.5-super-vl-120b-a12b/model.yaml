# NVIDIA Nemotron 3.5 Super VL 120B-A12B in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# NVIDIA's hybrid Mamba2 / mixture-of-experts model (120B, 12B active) with its RADIO image tower (ENG-365): from
# NVIDIA's own ModelOpt checkpoint (NVFP4 experts, FP8 Mamba2 / attention / head) read as stored,
# or from our EXL3 packs of the BF16 checkpoint (engine/models/nemotron_h, docs/nemotron-h.md), with NVIDIA's
# LiLiCorr drafter for it. weights_gib: allocated at load (measured 2026-10-16). Window up to 1,048,576 tokens, the
# checkpoint's own (config.json llm_config.max_position_embeddings, tokenizer model_max_length), slot 0 and the side
# slots alike; the default stays 262,144. Its KV is 8,192 bytes a token (8 attention layers, 2 KV heads of 128): 8 GiB
# at 1,048,576. Checked on EXL3 4.0 with slot 0 at 1,048,576 and 4 slots (ENG-363): needles 5/5 at 131,054 and 249,983
# prompt tokens; a 1,000,000-token prompt was not measured (not past 249,983). slots.max 3 is what was measured; the
# side slot's part beyond its KV (side_slot_const_gib) is measured at load. Rows of the measured table come from real
# runs only.
schema: 1
id: nemotron-3.5-super-vl-120b-a12b
name: Nemotron 3.5 Super VL 120B-A12B
family: Nemotron 3.5
params: ~120B, ~12B active a token
recommended: false
order: 6
pitch: NVIDIA's 120B hybrid Mamba2 and mixture-of-experts model that reads images too, from our EXL3 packs or NVIDIA's NVFP4 checkpoint.
architecture: 88 layers, 40 Mamba2, 40 mixture-of-experts (512 experts a layer, 22 a token, one shared, a 1,024-wide
  latent) and 8 attention layers without positional encoding, plus a one-step MTP head; it thinks in a <think> block
  and calls tools in the XML form. Images go through its C-RADIO ViT-H/16 tower and projector (BF16 in every
  checkpoint), 256 to 3,328 prompt rows an image (1,000 for a 1,280 x 800 screenshot).
license: The model's license (OpenMDW-1.1) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
- label: Model card
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
- label: BF16 checkpoint
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
devices:
