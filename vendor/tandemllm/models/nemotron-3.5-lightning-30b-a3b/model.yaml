# NVIDIA Nemotron 3.5 Lightning 30B-A3B in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# The NemotronH test model (engine/models/nemotron_h): the block types of Nemotron 3.5 Bolt (Mamba2, NoPE attention,
# mixture of experts, an MTP head) at a size that fits the Spark in BF16. One profile, the checkpoint as NVIDIA
# published it (ops/profiles/nemotron-lightning-bf16.env). weights_gib: allocated at load without the MTP head
# (measured 2026-10-15). max_window: the model's whole context, 262,144 tokens: its KV is 6,144 bytes a token (6
# attention layers, 2 KV heads of 128), 1.5 GiB at the full window. Rows of the measured table come from real runs only.
schema: 1
id: nemotron-3.5-lightning-30b-a3b
name: Nemotron 3.5 Lightning 30B-A3B
family: Nemotron 3.5
params: ~31.6B, ~3.5B active a token
recommended: false
# the test model: after the served models on the models step
order: 90
pitch: NVIDIA's hybrid Mamba2 and mixture-of-experts model in BF16, the test model for Nemotron 3.5 Bolt.
architecture: 52 layers, 23 Mamba2, 23 mixture-of-experts (128 experts, 6 a token, one shared) and 6 attention layers
  without positional encoding, plus one MTP block pair; it thinks in a <think> block and calls tools in the XML form.
license: The model's license (OpenMDW-1.1) is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
- label: Model card
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
devices:
- id: dgx-spark
  label: NVIDIA DGX Spark (128 GB unified memory)
  total_gib: 121.63
  reserved_gib: 10.0
  note: The GPU and the CPU share this memory. MemTotal reads 121.6 GiB of the 128 GB.
assets:
- id: qwen3.5-2b
  label: Qwen3.5-2B (the narrator, and Wren)
  path: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b/config.json
  also: []
  fetchable: true
  protected: false
  hf_repo: Qwen/Qwen3.5-2B
  fetch:
  - repo: Qwen/Qwen3.5-2B
    files:
    - '*.json'
    - '*.safetensors'
    - '*.jinja'
    - merges.txt
    - LICENSE
    to: ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
    gb: 4.57
  source: Public on Hugging Face; install.sh --setup downloads it for Wren, the fetch step when the narrator is on (VIS-153).
- id: laya
  label: Laya decision models
  path: ${HOME}/.qwen38-spark-engine/deciders/laya/model.safetensors
  also: []
  fetchable: true
  protected: false
  hf_repo: convaiinnovations/laya
  fetch:
  - repo: convaiinnovations/laya
    files:
    - config.json
    - rl_agent_config.json
    - model.safetensors
    - 'encoder/*'
    - 'tokenizer/*'
    - 'multilingual/*'
    - 'typed-decisions/*'
    to: ${HOME}/.qwen38-spark-engine/deciders/laya
    gb: 2.35
  source: Public on Hugging Face (no token needed); the fetch step downloads its three models when Laya is on (VIS-153). Its Python files are not downloaded.
profiles:
- id: nemotron-lightning-bf16
  label: BF16 (NVIDIA's checkpoint)
  format: bf16
  bpw: 16
  disk_gb: 65.8
  weights_gib: 59.04
  drafters_gib: 0.0
  hf_repo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  hf_private: false
  made_by: {kind: vendor, name: NVIDIA}
  recommended: true
  badges:
  - reference quality
  quality:
    kl_vs_bf16: 0.0
    top1_pct: 100.0
    ppl: null
    date: '2026-10-15'
    source: the BF16 checkpoint is the reference
  assets_required: []
  note: 'The checkpoint as NVIDIA published it (revision a9904d24), the NemotronH test model. A decode token reads
    6.55 GB of it (the checkpoint index''s decode bytes). Against transformers BF16, teacher-forced: top-1 98.63 % of
    1,024 chat positions, every difference a near tie (2026-10-15). Weights GiB: allocated at load (measured).'
  hf_revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9
  max_window: 262144
measurements:
  build: 0.9.1
  date: '2026-10-15'
  method: >-
    tools/fn_lookup_ab.py through one fresh server a run on the Spark, the GPU to itself: prompts prose / chat /
    code, one greedy request each, thinking off, 512 new tokens, conductor raw, max_len 32,768; the lookup cut by
    StairCut (its price file from tools/nh_check.py staircase), the suffix store off. One run a cell. Raw data:
    models/nemotron-3.5-lightning-30b-a3b/measurements/0.9.1-summary.json.
  source: models/nemotron-3.5-lightning-30b-a3b/measurements/0.9.1-summary.json
  rows:
  - profile: nemotron-lightning-bf16
    build: 0.9.1
    date: '2026-10-15'
    comparable: true
    note: 'The lookup, store off; plain prose / chat / code 34.14 / 33.77 / 33.97 tok/s; edit and copy asks 105.77 and 140.74 (33.85 and 33.74 plain); every text the plain run''s.'
    cells:
      greedy_512: {prose: [33.08, 33.08, 30.53, 1.01, 1], chat: [34.13, 34.13, 30.76, 1.05, 1], code: [36.21, 36.21, 33.42, 1.21, 1]}
    ttft_s: {}
    lossless: null

memory:
  parts:
  - id: engine
    label: Engine state, the decode graphs and warm-up
    gib: 1.4
    kind: fixed
    source: 'measured 2026-10-15 on the BF16 checkpoint: the load stages engine, drafters and warm-up took 0.26, 1.14 and -0.08 GiB of MemAvailable beyond the weights (server [memory] line, lookup server); 0.23 + 0.06 + 0.02 GiB allocated'
  - id: allocator
    label: Allocator reserve
    gib: 1.5
    kind: reserve
    source: an estimate until measured on the Spark
  sources:
  - engine/models/nemotron_h/pack.py decode_bytes (BF16 checkpoint headers, 2026-10-15)
  per_window_parts:
  - id: prefill_workspace
    label: Prefill workspace (a 4,096-token chunk's activations, the SSD chunks and the batched experts)
    bytes_per_token: 8192
    max_gib: 3.0
    kind: reserve
    source: 'an estimate until measured'
components:
- id: conductor
  label: Conductor
  group: features
  what: Gives each request the right instructions and helper packages, and watches long sessions so they do not
    get stuck.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.1
  depends_on: []
  conflicts: []
  knobs:
    CONDUCTOR:
      'on': 'on'
      'off': raw
    QSE_CONDUCTOR_CONFIG:
      'on': ${HOME}/.qwen38-spark-engine/conductor
      'off': 'off'
  assets: []
  docs: docs/server.md
  note: 'On by default, with the model fit LFM2.5 measured (Laya answers the class question, core skill only, no
    effort sentences, rules or memory notes) until it is measured on NemotronH.'
- id: narrator
  label: Narrator
  group: roles
  what: A small model that writes short status lines while the big model thinks, so you can see what it is doing.
  default: false
  required: false
  memory_gib: 3.6
  memory_max_gib: null
  elastic: true
  disk_gb: 4.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_NARRATOR_MODEL:
      'on': qwen3.5-2b
      'off': ''
    QWEN38_NARRATOR_DIR:
      'on': ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
      'off': ''
  assets:
  - qwen3.5-2b
  docs: docs/server.md
  note: Qwen3.5-2B, 3.60 GiB in the live memory split. When memory runs short it goes after the shadow reader and
    loads again later. Off by default since 0.11.3 (SRV-534); turned on, it serves the model, and the lines come with the roles document's narrator mode and a profile's ui.narrator.
- id: laya
  label: Laya decision models
  group: roles
  what: Three tiny classifiers that answer the conductor's quick questions, like what kind of request this is, in
    milliseconds.
  default: true
  required: false
  memory_gib: 1.6
  memory_max_gib: null
  elastic: false
  disk_gb: 2.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_DECIDER_MODELS:
      'on': laya-english,laya-multilingual,laya-typed-decisions
      'off': ''
  assets:
  - laya
  docs: docs/server.md
  note: The class question's answer under the model fit (served_classifier off).
- id: response_cache
  label: Response cache
  group: caches
  what: Answers an identical greedy request again from memory, without running the model.
  default: false
  required: false
  memory_gib: 0.25
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESPONSE_CACHE:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Off on the reference box. Useful for scripts that send the same request many times; never for a benchmark.
- id: proxy
  label: Other backends
  group: features
  what: Lets the dashboard send some model names to other servers or cloud APIs, beside this engine.
  default: false
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    QSE_BACKENDS:
      'on': ${HOME}/.qwen38-spark-engine/backends/config.sqlite3
      'off': ''
  assets: []
  docs: docs/proxy.md
  note: You add the backends later, on the Backends screen.
- id: prompt_cache
  label: Conversation cache
  group: caches
  what: Keeps the conversation the model is in, so the next turn starts where the last one ended instead of reading
    everything again.
  default: true
  required: false
  memory_gib: 0.16
  memory_max_gib: 2.5
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESIDENT_GB:
      'on': '2.5'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: The resident prefix with its anchors every 4,096 tokens (the prefill's chunk), the end anchor, the pin and
    the park; an anchor is 70.8 MiB (46.8 MiB of Mamba2 states and 4,096 tokens of KV at 6,144 bytes).
- id: state_store
  label: State store
  group: caches
  what: Saves the model's state after short chats, so the same start a second time costs nothing.
  default: true
  required: false
  memory_gib: 0.49
  memory_max_gib: 2.0
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    CACHE_GB:
      'on': '2'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: null
parallelism:
  slots:
    min: 1
    max: 3
    default: 3
  window:
    min: 8192
    max: 262144
    default: 262144
    step: 4096
  side_window:
    min: 8192
    max: 262144
    default: 262144
    step: 4096
  kv_pool:
    default: false
  floor_gb:
    min: 10
    max: 40
    default: 15
  kv_hard_floor_gb: 10
  kv_bytes_per_token: 6144
  typical_fill_tokens: 32768
  side_slot_const_gib: 0.0
  knobs:
    slots: QSE_PARALLEL
    window: MAX_LEN
    side_window: QSE_SIDE_MAX_LEN
    kv_pool: QSE_KV_POOL
    floor_gb: QSE_PARALLEL_FLOOR_GB
  fixed: {}
methods:
- id: temperature
  label: Temperature
  what: How random the answers are when a client does not say. NVIDIA's generation config sets 1.0.
  type: number
  min: 0
  max: 2
  default: 1.0
  recommended: 1.0
  knob: TEMPERATURE
  docs: docs/nemotron-h.md
- id: top_p
  label: Top-p
  what: The share of probability a sampled answer draws from, when a client does not say.
  type: number
  min: 0
  max: 1
  default: 0.95
  recommended: 0.95
  knob: TOP_P
  docs: docs/nemotron-h.md
- id: default_max_tokens
  label: Default answer length
  what: The longest answer, in tokens, when a client does not set max_tokens.
  type: int
  min: 1024
  max: 262144
  default: 32768
  recommended: 32768
  knob: DEFAULT_MAX_TOKENS
  docs: docs/server.md
- id: request_timeout
  label: Request time limit
  what: Seconds one request may run before the engine stops it.
  type: int
  min: 60
  max: 14400
  default: 3600
  recommended: 3600
  knob: REQUEST_TIMEOUT
  docs: docs/server.md
- id: max_queue
  label: Queue length
  what: How many requests may wait for a free slot before new ones are turned away.
  type: int
  min: 1
  max: 64
  default: 8
  recommended: 8
  knob: MAX_QUEUE
  docs: docs/server.md
- id: queue_timeout
  label: Queue wait
  what: Seconds a request may wait in the queue before it gets an error.
  type: int
  min: 10
  max: 3600
  default: 240
  recommended: 240
  knob: QUEUE_TIMEOUT
  docs: docs/server.md
advanced:
- id: port
  label: Port
  what: The port the API and the dashboard answer on.
  type: int
  min: 1024
  max: 65535
  default: 8000
  recommended: 8000
  knob: PORT
  docs: docs/operations.md
- id: host
  label: Listen on
  what: The whole network, or only this machine.
  type: enum
  options:
  - value: 0.0.0.0
    label: the whole network
  - value: 127.0.0.1
    label: this machine only
  default: 0.0.0.0
  recommended: 0.0.0.0
  knob: HOST
  docs: docs/operations.md
- id: served_model
  label: Raw engine name
  what: The model name of the raw engine. With the conductor on, clients see TandemLLM and this name is a hidden
    alias.
  type: string
  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
  default: qwen38-spark-engine
  recommended: qwen38-spark-engine
  knob: SERVED_MODEL
  docs: docs/server.md
- id: dashboard_login
  label: Dashboard login
  what: With an admin password set, on makes the dashboard ask for it too.
  type: enum
  options:
  - value: 'off'
    label: 'off'
  - value: 'on'
    label: 'on'
  default: 'off'
  recommended: 'off'
  knob: QSE_DASHBOARD_LOGIN
  docs: docs/server.md
- id: admin_password
  label: Admin password
  what: Without one, anyone who reaches the port can change the setup. Generate writes a random one into secrets.env
    on the box; read it there with cat.
  type: enum
  options:
  - value: keep
    label: keep as it is
  - value: generate
    label: generate one
  default: keep
  recommended: keep
  knob: null
  docs: docs/operations.md
