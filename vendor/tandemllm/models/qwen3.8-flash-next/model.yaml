# The measured table: one run a cell on 3.05 (2026-10-12, build 0.7.2 of flashnext-v2), the served
# speculation (the MTP layer with the lookup in the same tree, StairCut), greedy, thinking off, up to 512
# new tokens (prose stopped at 421), one request at a time on a fresh server. A cell is
# [tok/s, tok/s min, ms a round, tokens a round, n]: one run, so min = tok/s and n = 1; ms a round is
# tokens a round over tok/s. Raw data: spark ~/fn2/runs/e229-look.json (the ENG-229 A/B, its look arm).
measurements:
  build: 0.7.2
  date: '2026-10-12'
  method: >-
    The ENG-229 A/B's served arm on 3.05: one fresh server, prompts prose / chat / code, one greedy
    request each, thinking off, up to 512 new tokens, the MTP layer with the lookup in one tree cut by
    StairCut (QWEN38_FN_LOOKUP=1, as the profiles serve it). One run a cell; caches, the conductor and
    parallel slots off.
  source: ENG-229 A/B, 2026-10-12 03:22 (raw data spark ~/fn2/runs/e229-look.json)
  rows:
    - profile: flashnext-3.05
      build: "0.7.2"
      date: "2026-10-12"
      comparable: true
      cells:
        greedy_512: {prose: [51.07, 51.07, 42.1, 2.15, 1], chat: [64.0, 64.0, 38.9, 2.49, 1], code: [82.69, 82.69, 42.1, 3.48, 1]}
      ttft_s: {}
      lossless: null
memory:
  parts:
  - id: engine
    label: Engine state, the draft layer's buffers, graphs and warm-up
    gib: 5.69
    kind: fixed
    source: 'calibrated on the SPD-99 runs of 2026-10-12 (2.05 warm, 3.05 cold, 4.05 cold at 262,144 tokens):
      what the engine held at its peak beyond the weights, the table and the other parts here, 34.2 to 35.5 GiB
      at 262,144, the mean taken; the parity note had 1.85 from short contexts'
  - id: allocator
    label: Allocator reserve
    gib: 2.3
    kind: reserve
    source: parity note 2026-10-11
  sources:
  - Flash-Next caches note, 2026-10-12 (bytes a token 29,952 stored, 31,040 a slot)
  - tools/fn_memory_check.py on 3.05, 2026-10-12 (prefill workspace 2.51 GiB at 8k, 2.40 GiB at 32k)
  - tools/fn_fit_run.py on 2.05, 3.05 and 4.05, 2026-10-12 (SPD-99; the lowest MemAvailable at 262,144 tokens)
  per_window_parts:
  - id: prefill_workspace
    label: Prefill workspace (sparse-attention scores, a chunk's activations)
    bytes_per_token: 76309
    max_gib: 10.5
    kind: reserve
    source: measured 2026-10-12 on 3.05 (SPD-99), 10.46 GiB above the engine at a 147,149-token prefill and 10.47
      at 261,549, 2.40 at 32,768; it stops growing at about 140k tokens
  - id: window_buffers
    label: Warm-up buffers, graphs and the draft layer's cache (they grow with the window)
    bytes_per_token: 32230
    kind: fixed
    source: 'the load stages on 3.05 (2026-10-12): MemAvailable taken by the warm-up 1.14 GiB at 32,768, 4.23 at
      147,456, 7.2 to 7.5 at 262,144; the draft layer''s KV 0.32 and 0.83 GiB at 32,768 and 262,144'
components:
- id: conductor
  label: Conductor
  group: features
  what: Gives each request the right instructions and helper packages, and watches long sessions so they do not
    get stuck.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.1
  depends_on: []
  conflicts: []
  knobs:
    CONDUCTOR:
      'on': 'on'
      'off': raw
    QSE_CONDUCTOR_CONFIG:
      'on': ${HOME}/.qwen38-spark-engine/conductor
      'off': 'off'
  assets: []
  docs: docs/server.md
  note: Off, clients talk to the raw engine and the small models below have nothing to do.
- id: narrator
  label: Narrator
  group: roles
  what: A small model that writes short status lines while the big model thinks, so you can see what it is doing.
  default: false
  required: false
  memory_gib: 3.6
  memory_max_gib: null
  elastic: true
  disk_gb: 4.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_NARRATOR_MODEL:
      'on': qwen3.5-2b
      'off': ''
    QWEN38_NARRATOR_DIR:
      'on': ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
      'off': ''
  assets:
  - qwen3.5-2b
  docs: docs/server.md
  note: Qwen3.5-2B, 3.60 GiB in the live memory split. When memory runs short it goes after the shadow reader and
    loads again later.
- id: laya
  label: Laya decision models
  group: roles
  what: Three tiny classifiers that answer the conductor's quick questions, like what kind of request this is, in
    milliseconds.
  default: false
  required: false
  memory_gib: 1.6
  memory_max_gib: null
  elastic: false
  disk_gb: 2.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_DECIDER_MODELS:
      'on': laya-english,laya-multilingual,laya-typed-decisions
      'off': ''
  assets:
  - laya
  docs: docs/server.md
  note: Without them the big model answers those questions itself, which costs a turn each time.
- id: shadow
  label: Shadow reader
  group: roles
  what: A small model that reads along with each session when the box is idle, so later questions about it are answered
    fast.
  default: false
  required: false
  memory_gib: 1.52
  memory_max_gib: 5.52
  elastic: true
  disk_gb: 1.7
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_SHADOW_MODEL:
      'on': qwen3.5-0.8b
      'off': ''
  assets:
  - qwen3.5-0.8b
  docs: docs/shadow-reader.md
  note: Qwen3.5-0.8B (1.52 GiB in the live memory split) and up to 4 GiB of session states (QWEN38_SHADOW_GB). The
    first to unload when memory runs short.
- id: vision
  label: Vision
  group: features
  what: Lets the model read images you send with a message.
  default: true
  required: false
  memory_gib: 0.31
  memory_max_gib: 0.81
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    VISION:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/server.md
  note: The tower ships inside the pack, quantised like the model (0.29 GB in 3.05; the load stage took 0.27 GiB
    allocated and 0.26 to 0.31 GiB of MemAvailable, VIS-97, 2026-10-12). The extra 0.5 GiB is the cache of encoded
    images (--image-cache-mb 512). The other packs' towers are 4 bits (2.05) or 6 (4.05 to 6.05), about 0.24 and
    0.36 GB; 4.05 keeps its tower in vision_k6.safetensors beside the shards.
- id: prompt_cache
  label: Conversation cache
  group: caches
  what: Keeps the conversation the model is in, so the next turn starts where the last one ended instead of reading
    everything again.
  default: true
  required: false
  memory_gib: 0.43
  memory_max_gib: 11.5
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESIDENT_GB:
      'on': '2.5'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: The resident prefix with its anchors every 4,096 tokens (Flash-Next's prefill chunk), the end anchor, the
    pin and the park; an anchor is 110.3 MiB.
- id: state_store
  label: State store
  group: caches
  what: Saves the model's state after short chats, so the same start a second time costs nothing.
  default: true
  required: false
  memory_gib: 0.49
  memory_max_gib: 2.0
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    CACHE_GB:
      'on': '2'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: null
- id: response_cache
  label: Response cache
  group: caches
  what: Answers an identical greedy request again from memory, without running the model.
  default: false
  required: false
  memory_gib: 0.25
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESPONSE_CACHE:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Off on the reference box. Useful for scripts that send the same request many times; never for a benchmark.
- id: disk_tier
  label: Disk cache
  group: disk
  what: Keeps the start of long prompts on the SSD, so a long agent session or a returning chat starts in seconds.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 16.0
  depends_on: []
  conflicts: []
  knobs:
    QSE_DISK_CACHE:
      'on': null
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: A folder of its own per profile (the profile file names it); a file of another fingerprint is swept.
- id: nvme_spill
  label: Session spill
  group: disk
  what: Moves a paused conversation to the SSD instead of dropping it, and brings it back on its next turn.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 64.0
  depends_on:
  - disk_tier
  conflicts: []
  knobs:
    SESSION_SPILL:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Compressed, up to SESSION_SPILL_GB (64 GB), inside the disk cache's folder.
- id: proxy
  label: Other backends
  group: features
  what: Lets the dashboard send some model names to other servers or cloud APIs, beside this engine.
  default: false
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    QSE_BACKENDS:
      'on': ${HOME}/.qwen38-spark-engine/backends/config.sqlite3
      'off': ''
  assets: []
  docs: docs/proxy.md
  note: You add the backends later, on the Backends screen.
parallelism:
  slots:
    min: 1
    max: 1
    default: 1
  window:
    min: 8192
    max: 262144
    default: 262144
    step: 4096
  side_window:
    min: 8192
    max: 262144
    default: 262144
    step: 4096
  kv_pool:
    default: false
  floor_gb:
    min: 10
    max: 40
    default: 15
  kv_hard_floor_gb: 10
  kv_bytes_per_token: 31040
  typical_fill_tokens: 32768
  side_slot_const_gib: 0.0
  knobs:
    slots: QSE_PARALLEL
    window: MAX_LEN
    side_window: QSE_SIDE_MAX_LEN
    kv_pool: QSE_KV_POOL
    floor_gb: QSE_PARALLEL_FLOOR_GB
  fixed: {}
methods:
- id: reasoning_effort
  label: Thinking effort
  what: How long the model may think before it answers, when a client does not say.
  type: enum
  options:
  - value: low
    label: low
  - value: medium
    label: medium
  - value: xhigh
    label: extra high
  default: medium
  recommended: medium
  knob: REASONING_EFFORT
  docs: docs/server.md
- id: default_max_tokens
  label: Default answer length
  what: The longest answer, in tokens, when a client does not set max_tokens.
  type: int
  min: 1024
  max: 262144
  default: 32768
  recommended: 32768
  knob: DEFAULT_MAX_TOKENS
  docs: docs/server.md
- id: request_timeout
  label: Request time limit
  what: Seconds one request may run before the engine stops it.
  type: int
  min: 60
  max: 14400
  default: 3600
  recommended: 3600
  knob: REQUEST_TIMEOUT
  docs: docs/server.md
- id: max_queue
  label: Queue length
  what: How many requests may wait for a free slot before new ones are turned away.
  type: int
  min: 1
  max: 64
  default: 8
  recommended: 8
  knob: MAX_QUEUE
  docs: docs/server.md
- id: queue_timeout
  label: Queue wait
  what: Seconds a request may wait in the queue before it gets an error.
  type: int
  min: 10
  max: 3600
  default: 240
  recommended: 240
  knob: QUEUE_TIMEOUT
  docs: docs/server.md
advanced:
- id: port
  label: Port
  what: The port the API and the dashboard answer on.
  type: int
  min: 1024
  max: 65535
  default: 8000
  recommended: 8000
  knob: PORT
  docs: docs/operations.md
- id: host
  label: Listen on
  what: The whole network, or only this machine.
  type: enum
  options:
  - value: 0.0.0.0
    label: the whole network
  - value: 127.0.0.1
    label: this machine only
  default: 0.0.0.0
  recommended: 0.0.0.0
  knob: HOST
  docs: docs/operations.md
- id: served_model
  label: Raw engine name
  what: The model name of the raw engine. With the conductor on, clients see TandemLLM and this name is a hidden
    alias.
  type: string
  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
  default: qwen38-spark-engine
  recommended: qwen38-spark-engine
  knob: SERVED_MODEL
  docs: docs/server.md
- id: dashboard_login
  label: Dashboard login
  what: With an admin password set, on makes the dashboard ask for it too.
  type: enum
  options:
  - value: 'off'
    label: 'off'
  - value: 'on'
    label: 'on'
  default: 'off'
  recommended: 'off'
  knob: QSE_DASHBOARD_LOGIN
  docs: docs/server.md
- id: admin_password
  label: Admin password
  what: Without one, anyone who reaches the port can change the setup. Generate writes a random one into secrets.env
    on the box; read it there with cat.
  type: enum
  options:
  - value: keep
    label: keep as it is
  - value: generate
    label: generate one
  default: keep
  recommended: keep
  knob: null
  docs: docs/operations.md
