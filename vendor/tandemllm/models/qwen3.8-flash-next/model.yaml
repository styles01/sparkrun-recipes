# Qwen3.8-Flash-Next in TandemLLM: the setup guide's registry entry (docs/setup.md, OPS-97). Schema 1.
#
# turboderp's EXL3 packs, one profile each (ops/profiles/flashnext-<bpw>.env). weights_gib: the weights
# with the draft layer and the int8 mixers on the device (3.05 measured: load stage `weights`, 2026-10-12
# with the mixers' scale a group of 128 weights; the others from their file sizes, 2026-10-11, plus the
# group scales' 0.02 GiB); disk_gb: the pack with its n-gram table (3.05 measured,
# the others from the repository's file sizes; 4.05, 5.05 and 6.05 share one table file). table: the
# n-gram table beside the weights, warm in the page cache or read past it (ENG-239). max_window: the
# largest window that fits the Spark preset (SRV-337), from the estimate below calibrated on the SPD-99
# runs of 2026-10-12, whose lowest MemAvailable it predicts within 0.7 GiB (2.05 warm, 3.05 and 4.05
# cold, all at 262,144 tokens, with this box's 4.6 GiB of other programs in place of the preset's 10):
# 2.05 and 3.05 262,144, 4.05 208,896, 5.05 53,248 (with the vision tower on, VIS-97: 212,992 and 65,536
# without it), 6.05 none. 3.05 reads its table cold: warm, the whole
# table resident took MemAvailable less the table to 8.4 GiB at 147,456 tokens, under the 15 GiB floor. No
# drafters: the draft layer is in the pack. Rows of the measured table come from real runs only (SPD-65,
# SPD-99). The small models (narrator, Laya, the shadow reader) are off by default; switched on, the
# estimate shows the window that is left.
schema: 1
id: qwen3.8-flash-next
name: Qwen3.8-Flash-Next
family: Qwen3.8
params: ~124B, ~3B active a token
recommended: false
pitch: A mixture-of-experts model that reads only a few experts a token, in turboderp's EXL3 packs, with its own
  draft layer.
architecture: 48 layers (36 Gated DeltaNet, 12 sparse-attention), each a mixture of 512 experts of which 10 and
  a shared one run a token (about 121B of the parameters), four hyper-connection streams, a hashed n-gram embedding
  (PLE) and one multi-token-prediction layer that drafts for speculation.
license: The model's license is on its Hugging Face page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null
links:
- label: EXL3 packs
  url: https://huggingface.co/turboderp/Qwen3.8-Flash-Next-exl3
devices:
- id: dgx-spark
  label: NVIDIA DGX Spark (128 GB unified memory)
  total_gib: 121.63
  reserved_gib: 10.0
  note: The GPU and the CPU share this memory. MemTotal reads 121.6 GiB of the 128 GB.
