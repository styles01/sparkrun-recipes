# The installable part of TandemLLM: the dashboard and the OpenAI-compatible proxy (docs/proxy.md).
#
#   pip install .                  the proxy, the dashboard, `tandem-dash`; cryptography only
#   pip install '.[host]'          plus psutil and NVML for the System view's hosts
#
# The wheel never pulls torch. It carries `proxy/`, the `server/` modules the dashboard uses
# (`server/app.py` is in it but imports torch only when the engine itself runs) and the built
# page (`dashboard/dist`, as `proxy/dashboard`) and the shipped texts the conductor starts with
# (`packages/`, as `proxy/packages`: the standalone proxy runs the conductor). The engine keeps its own environment and lock
# in install.sh; its venv installs this file in editable mode (`pip install -e .`) so that
# `server/app.py --backends` finds `proxy/` and `cryptography`.
#
# There is no `engine` extra (0.3.36-test): the engine's torch and torchvision must be the matched
# CUDA 13.0 pair from the PyTorch index, which an extra cannot say, and an extra that resolved
# torchvision from PyPI could replace a container's torch. install.sh's LOCK is the one list
# (pillow and torchvision included); tests/test_engine_deps.py checks the image path against it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tandemllm"
dynamic = ["version"]
description = "TandemLLM's dashboard as an OpenAI-compatible proxy: one ledger and one dashboard in front of any OpenAI-compatible engine or cloud API"
readme = "docs/proxy.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md", "NOTICE"]
authors = [{ name = "Khaled Bakeer" }]
keywords = ["llm", "openai", "proxy", "dashboard", "vllm", "sglang", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Environment :: Web Environment",
  "Topic :: System :: Monitoring",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
host = ["nvidia-ml-py>=12", "psutil>=5.9"]

[project.scripts]
tandem-dash = "proxy.__main__:main"

[tool.setuptools]
include-package-data = false
packages = [
  "chatd",
  "proxy",
  "proxy.adapters",
  "proxy.dashboard",
  "proxy.dashboard.assets",
  "proxy.packages",
  "server",
  "server.conductor",
  "server.conductor.monitor",
  "server.laya_kit",
  "server.setup",
]

[tool.setuptools.package-dir]
"proxy.dashboard" = "dashboard/dist"
"proxy.dashboard.assets" = "dashboard/dist/assets"
"proxy.packages" = "packages"

[tool.setuptools.package-data]
proxy = ["*.json"]
"proxy.dashboard" = ["*.html", "*.ico", "*.svg", "*.png", "*.webmanifest"]
"proxy.dashboard.assets" = ["*"]
"proxy.packages" = ["*.json", "inline/*", "skills/**/*", "library/*", "library/**/*", "system/**/*", "everyday/*", "everyday/**/*"]
server = ["METRICS.md"]
"server.conductor.monitor" = ["policy.default.json"]
"server.laya_kit" = ["*.js"]
"server.setup" = ["*.md"]

[tool.setuptools.dynamic]
version = { attr = "proxy._version.PEP440" }
