# qwen38-spark-engine on DGX :8000 as a Prometheus target, for the cluster-monitoring
# repo. Its own ServiceMonitor over the same selector-less `dgx-metrics` Service the vLLM
# targets use (dgx-vllm-scrape.yaml), rather than two more endpoints in `dgx-vllm`: the engine is
# not a vLLM (its series are qse_*, its alerts are qse-engine-rules.yaml) and its jobs are not
# `vllm`, so bin/dgx-roster-parity.py -- which checks the job=vllm roster -- stays green as it is.
#
# Two endpoints, both through the metrics proxy's vhost:
#   /metrics/qse-engine-up  -> :8000/metrics/up  public, one number   job qse-engine-health
#   /metrics/qse-engine     -> :8000/metrics     the metrics token    job qse-engine
# so an engine that is down and a token that is wrong are two different alerts.
#
# The token is the k8s Secret qse-metrics-token (qse-metrics-token-secret.example.yaml), whose
# value is QSE_METRICS_TOKEN from ~/.qwen38-spark-engine/secrets.env on the box -- created by
# hand, never committed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qse-engine
  namespace: monitoring
  labels:
    app: dgx-metrics
    app.kubernetes.io/part-of: strata-alerting
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app: dgx-metrics
  endpoints:
    - port: metrics
      path: /metrics/qse-engine-up
      interval: 15s
      scrapeTimeout: 5s
      relabelings:
        - targetLabel: job
          replacement: qse-engine-health
        - targetLabel: instance
          replacement: dgx:8000
        - targetLabel: role
          replacement: qwen38-spark-engine
        - targetLabel: served_model
          replacement: qwen38-spark-engine
        - targetLabel: node
          replacement: dgx

    - port: metrics
      path: /metrics/qse-engine
      interval: 15s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: qse-metrics-token
          key: token
      relabelings:
        - targetLabel: job
          replacement: qse-engine
        - targetLabel: instance
          replacement: dgx:8000
        - targetLabel: role
          replacement: qwen38-spark-engine
        - targetLabel: served_model
          replacement: qwen38-spark-engine
        - targetLabel: node
          replacement: dgx
