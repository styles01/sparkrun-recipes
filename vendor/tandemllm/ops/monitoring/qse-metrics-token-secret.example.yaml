# The metrics token for the qse-engine scrape. NOT applied from this file: the value is
# never committed. Create the Secret from the box's secrets file, without printing it:
#
#   kubectl -n monitoring create secret generic qse-metrics-token \
#     --from-literal=token="$(ssh <engine-host> "sed -n 's/^QSE_METRICS_TOKEN=//p' ~/.qwen38-spark-engine/secrets.env")" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# After `bash ops/make-secrets.sh --rotate` on the box, run it again (QseMetricsScrapeFailing
# fires until you do).
apiVersion: v1
kind: Secret
metadata:
  name: qse-metrics-token
  namespace: monitoring
type: Opaque
stringData:
  token: "<QSE_METRICS_TOKEN from ~/.qwen38-spark-engine/secrets.env on the box>"
