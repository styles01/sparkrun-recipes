<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the saved theme before first paint (every page, including the standalone Showcase window).
    try {
      var t = localStorage.getItem("sparkdash-theme");
      if (t === "white" || t === "light" || t === "dark" || t === "oled") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sparkDash — Multi-DGX Spark Monitoring Dashboard</title>

  <!-- Favicon (multi-size ICO, widely supported) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <!-- SVG favicon (modern browsers) -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <!-- Apple touch icon (iOS / macOS Safari) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- PNG fallbacks for various sizes -->
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icon-128.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="/icon-256.png" />

  <!-- Theme color for browser chrome (dark dashboard) -->
  <meta name="theme-color" content="#0a0a0a" />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
